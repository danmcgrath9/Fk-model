name: fk state count

# What a history pull of other states would cost, before paying for it: for each day in the range, ONE
# Get Meetings By Date call (1 credit) and the estimate history_pull.py would act on, nothing fetched.
# Prints one COUNT line a day (meetings and races by state, credits) and the total.

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'first day YYYY-MM-DD'
        required: true
      to:
        description: 'last day YYYY-MM-DD'
        required: true
      state:
        description: 'Form King states, comma separated (VIC NSW QLD SA WA TAS ACT NT)'
        default: 'NSW'
      every:
        description: 'count every Nth day (7 = one day a week, a sample)'
        default: '1'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Count
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true"; exit 1; }
          d="${{ github.event.inputs.to }}"; n=0
          while [ "$d" != "$(date -I -d "${{ github.event.inputs.from }} - 1 day")" ]; do
            if [ $((n % ${{ github.event.inputs.every }})) -eq 0 ]; then
              python scripts/history_pull.py --key live --yes --out /tmp/nohistory --count-only \
                --state "${{ github.event.inputs.state }}" --date "$d" 2>&1 | grep -E "^COUNT|nothing new|no .* meetings|FAILED|STOPPED" || echo "COUNT $d none"
            fi
            n=$((n + 1)); d=$(date -I -d "$d - 1 day")
          done | tee counts.txt | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re
          days = races = credits = 0
          for line in open("counts.txt"):
              if not line.startswith("COUNT"): continue
              days += 1
              races += sum(int(x) for x in re.findall(r"/(\d+)r", line))
              m = re.search(r"credits:(\d+)", line); credits += int(m.group(1)) if m else 0
          print(f"\n{days} days counted: {races} races, {credits} credits to pull them (plus 1 a day for the meetings call)")
          PY
