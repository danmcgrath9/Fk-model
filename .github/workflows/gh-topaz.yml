name: gh topaz

# Greyhound form and results from Topaz (research/greyhound/README.md). Manual only.
# Two guards before any call: the TOPAZ_API_KEY secret (issued by GRV, personal use) and the repository variable
# TOPAZ_TERMS_READ=yes, set by the founder after reading GRV's terms (Jason Adams' emails of 30 Oct 2026 until the
# formal terms exist).
# mode=probe: health + one Victorian day's column list, nothing stored. Run this first with a new key.
# mode=run: pull the months day by day into this run's disk, run a research script over them, and keep only the
# script's printed results (founder, 4 Nov 2026: "We don't need to do any of that, just pull it"). The Topaz files are
# never uploaded as a release or artifact: between runs they sit in this repository's Actions cache, which only this
# repository's workflows can restore (not a public download). A whole month of VIC times out, and one day takes about
# 5 s, so the first full history takes several runs: each pulls for up to max_minutes, saves the cache, and runs the
# script only once every month is in.
# mode=pull: bulk runs, one file per state and month, kept on the "topaz-history" release of the PRIVATE data
# repository (variable GREYHOUND_DATA_REPO, default danmcgrath9/fk-greyhound-data), never on this public one: GRV's
# data is personal use. Written with the GREYHOUND_DATA_TOKEN secret (a fine-grained token with Contents read and
# write on that repository only). A month the release already holds is not pulled again (except this month and last),
# so re-running only fills gaps.
# Separate from every fk-* workflow: no Form King key, no BetMatic, no database.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe, run (pull into this run only, then the script), pull (to the private data repo), preview, preview-compare (from=YYYY-MM-DD), isolynx (tracking data, one call per dog, resumable; from=YYYY-MM-DD is the first date), or isolynx-probe (one race, which Isolynx endpoints the key may call)'
        default: 'probe'
      script:
        description: 'mode=run: research scripts, space separated, each run as python SCRIPT greyhound/cache/topaz LABEL'
        default: 'research/greyhound/topaz_profile.py'
      isolynx:
        description: "mode=run: yes = restore the Isolynx pull beside the runs (ISOLYNX_DIR for the scripts)"
        default: 'no'
      trials:
        description: 'mode=run: yes = also pull trial results (trials_<STATE>_<YYYY-MM>), cached beside the runs'
        default: 'no'
      races:
        description: "mode=run: yes = also pull the race records (races_<STATE>_<YYYY-MM>: GRV's tips and analyst comment), cached beside the runs (RACES_DIR for the scripts)"
        default: 'no'
      betfair:
        description: "mode=run: yes = also download Betfair's free ANZ greyhound files (2020 on) for BSP, as BETFAIR_DIR"
        default: 'yes'
      label:
        description: 'mode=run: label for the report'
        default: 'topaz VIC'
      env:
        description: 'mode=run: KEY=VALUE pairs, space separated, exported for the scripts (e.g. WALK_REFIT_EVERY=2 WALK_GRV_RATING=yes)'
        default: ''
      states:
        description: 'comma separated: VIC,NSW,QLD,SA,WA,TAS,NT,NZ'
        default: 'VIC'
      from:
        description: 'first month YYYY-MM'
        default: '2020-01'
      to:
        description: 'last month YYYY-MM (blank = this month)'
        default: ''
      refresh:
        description: 'months to pull again, comma separated YYYY-MM; blank = none'
        default: ''
      max_calls:
        description: 'API calls this run (the rest resume next run)'
        default: '400'
      max_minutes:
        description: 'mode=run: minutes of pulling before the cache is saved (the rest resume next run)'
        default: '300'

concurrency:
  # one pull, preview or isolynx job at a time (they write a cache or the data release); run-mode jobs may overlap,
  # because with the history cached their pull is the current month's few days and the client retries a 429
  group: gh-topaz-${{ github.event.inputs.mode }}${{ github.event.inputs.mode == 'run' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

permissions:
  contents: read    # the data goes to the private data repository, written with GREYHOUND_DATA_TOKEN

jobs:
  topaz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ secrets.GREYHOUND_DATA_TOKEN }}
      GH_REPO: ${{ vars.GREYHOUND_DATA_REPO || 'danmcgrath9/fk-greyhound-data' }}
      TOPAZ_API_KEY: ${{ secrets.TOPAZ_API_KEY }}
      TOPAZ_TERMS_READ: ${{ vars.TOPAZ_TERMS_READ }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31' pandas numpy

      - name: Probe
        if: github.event.inputs.mode == 'probe'
        run: python -m greyhound.pull --probe | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore the pulled months (Actions cache, this repository only)
        if: github.event.inputs.mode == 'run'
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/topaz
          key: topaz-${{ github.event.inputs.states }}-${{ github.run_id }}
          restore-keys: topaz-${{ github.event.inputs.states }}-

      - name: Restore pre-race snapshots (Actions cache, this repository only)
        if: startsWith(github.event.inputs.mode, 'preview')
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/preview
          key: topaz-preview-${{ github.run_id }}
          restore-keys: topaz-preview-

      - name: Snapshot today's remaining VIC races before they run
        if: github.event.inputs.mode == 'preview'
        run: |
          D=""; [[ "${{ github.event.inputs.from }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && D="--date ${{ github.event.inputs.from }}"
          python -m greyhound.preview snapshot $D | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare a snapshot with the bulk feed the day after
        if: github.event.inputs.mode == 'preview-compare'
        run: python -m greyhound.preview compare "${{ github.event.inputs.from }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save pre-race snapshots (Actions cache)
        if: always() && startsWith(github.event.inputs.mode, 'preview')
        uses: actions/cache/save@v4
        with:
          path: greyhound/cache/preview
          key: topaz-preview-${{ github.run_id }}

      - name: Restore the Isolynx pull (Actions cache, this repository only)
        if: github.event.inputs.mode == 'isolynx' || (github.event.inputs.mode == 'run' && github.event.inputs.isolynx == 'yes')
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/isolynx
          key: topaz-isolynx-${{ github.run_id }}
          restore-keys: topaz-isolynx-

      - name: Restore the pulled months for the Isolynx dog list
        if: github.event.inputs.mode == 'isolynx' || github.event.inputs.mode == 'isolynx-probe'
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/topaz
          key: topaz-${{ github.event.inputs.states }}-${{ github.run_id }}
          restore-keys: topaz-${{ github.event.inputs.states }}-

      - name: Probe the Isolynx endpoints on one tracked race (field names only)
        if: github.event.inputs.mode == 'isolynx-probe'
        run: python -m greyhound.isolynx probe --runs greyhound/cache/topaz --since "${{ github.event.inputs.from }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pull Isolynx tracking, one call per dog, resumable
        if: github.event.inputs.mode == 'isolynx'
        run: |
          set -o pipefail
          python -m greyhound.isolynx pull --runs greyhound/cache/topaz --out greyhound/cache/isolynx \
            --since "${{ github.event.inputs.from }}" --max-minutes "${{ github.event.inputs.max_minutes }}" | tee -a "$GITHUB_STEP_SUMMARY" || true
          python -m greyhound.isolynx table --out greyhound/cache/isolynx | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the Isolynx pull (Actions cache)
        if: always() && github.event.inputs.mode == 'isolynx'
        uses: actions/cache/save@v4
        with:
          path: greyhound/cache/isolynx
          key: topaz-isolynx-${{ github.run_id }}

      - name: Pull into this run only (day by day)
        id: pullrun
        if: github.event.inputs.mode == 'run'
        run: |
          TO_ARG=""; [ -n "${{ github.event.inputs.to }}" ] && TO_ARG="--to ${{ github.event.inputs.to }}"
          set -o pipefail
          python -m greyhound.pull --states "${{ github.event.inputs.states }}" --from "${{ github.event.inputs.from }}" $TO_ARG \
            --by-day --workers 8 --per-minute 72 --max-calls 100000 --max-minutes "${{ github.event.inputs.max_minutes }}" | tee pull-report.md
          tail -1 pull-report.md >> "$GITHUB_STEP_SUMMARY"
          LEFT=$(tail -1 pull-report.md | sed -nE 's/.*; ([0-9]+) left for the next run.*/\1/p')
          FAILED=$(tail -1 pull-report.md | sed -nE 's/.*; ([0-9]+) failed;.*/\1/p')
          echo "complete=$([ "${LEFT:-0}" = "0" ] && [ "${FAILED:-0}" = "0" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          grep -E "failed|outside" pull-report.md | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pull trials into this run only (day by day)
        id: pulltrials
        if: github.event.inputs.mode == 'run' && github.event.inputs.trials == 'yes'
        run: |
          set -o pipefail
          python -m greyhound.pull --trials --states "${{ github.event.inputs.states }}" --from "${{ github.event.inputs.from }}" \
            --workers 8 --per-minute 72 --max-calls 100000 --max-minutes "${{ github.event.inputs.max_minutes }}" | tee trials-report.md
          tail -1 trials-report.md >> "$GITHUB_STEP_SUMMARY"
          LEFT=$(tail -1 trials-report.md | sed -nE 's/.*; ([0-9]+) left for the next run.*/\1/p')
          FAILED=$(tail -1 trials-report.md | sed -nE 's/.*; ([0-9]+) failed;.*/\1/p')
          echo "complete=$([ "${LEFT:-0}" = "0" ] && [ "${FAILED:-0}" = "0" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          grep -E "failed|outside" trials-report.md | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pull the race records into this run only (a month a call)
        id: pullraces
        if: github.event.inputs.mode == 'run' && github.event.inputs.races == 'yes'
        run: |
          set -o pipefail
          python -m greyhound.pull --races --states "${{ github.event.inputs.states }}" --from "${{ github.event.inputs.from }}" \
            --workers 8 --per-minute 72 --max-calls 100000 --max-minutes "${{ github.event.inputs.max_minutes }}" | tee races-report.md
          tail -1 races-report.md >> "$GITHUB_STEP_SUMMARY"
          LEFT=$(tail -1 races-report.md | sed -nE 's/.*; ([0-9]+) left for the next run.*/\1/p')
          FAILED=$(tail -1 races-report.md | sed -nE 's/.*; ([0-9]+) failed;.*/\1/p')
          echo "complete=$([ "${LEFT:-0}" = "0" ] && [ "${FAILED:-0}" = "0" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          grep -E "failed|outside" races-report.md | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save the pulled months (Actions cache)
        if: always() && github.event.inputs.mode == 'run'
        uses: actions/cache/save@v4
        with:
          path: greyhound/cache/topaz
          key: topaz-${{ github.event.inputs.states }}-${{ github.run_id }}

      - name: Not every month is in yet
        if: github.event.inputs.mode == 'run' && (steps.pullrun.outputs.complete != 'yes' || (github.event.inputs.trials == 'yes' && steps.pulltrials.outputs.complete != 'yes') || (github.event.inputs.races == 'yes' && steps.pullraces.outputs.complete != 'yes'))
        run: echo "Months are still missing (see the pull report above); run mode=run again to continue." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Betfair's free ANZ greyhound files (BSP; terms read 25 Oct 2026, research/greyhound/README.md)
        if: github.event.inputs.mode == 'run' && github.event.inputs.betfair == 'yes' && steps.pullrun.outputs.complete == 'yes' && (github.event.inputs.trials != 'yes' || steps.pulltrials.outputs.complete == 'yes') && (github.event.inputs.races != 'yes' || steps.pullraces.outputs.complete == 'yes')
        run: |
          mkdir -p bf
          for f in ANZ_Greyhounds_2020.zip ANZ_Greyhounds_2021.zip ANZ_Greyhounds_2022.zip ANZ_Greyhounds_2023.zip \
                   ANZ_Greyhounds_2024.zip ANZ_Greyhounds_2025.zip $(for m in 01 02 03 04 05 06 07 08 09 10 11 12; do echo ANZ_Greyhounds_2026_$m.csv; done); do
            curl -fsSL --retry 3 -o "bf/$f" "https://betfair-datascientists.github.io/data/assets/$f" 2>/dev/null \
              && echo "$f $(stat -c %s "bf/$f") bytes" || { rm -f "bf/$f"; echo "not published: $f"; }
          done

      - name: Run the scripts (results only; the data is not kept)
        if: github.event.inputs.mode == 'run' && steps.pullrun.outputs.complete == 'yes' && (github.event.inputs.trials != 'yes' || steps.pulltrials.outputs.complete == 'yes') && (github.event.inputs.races != 'yes' || steps.pullraces.outputs.complete == 'yes')
        run: |
          pip install lightgbm scikit-learn scipy
          set -o pipefail
          [ -d bf ] && export BETFAIR_DIR="$PWD/bf"
          [ -d greyhound/cache/isolynx ] && export ISOLYNX_DIR="$PWD/greyhound/cache/isolynx"
          ls greyhound/cache/topaz/races_*.json.gz >/dev/null 2>&1 && export RACES_DIR="$PWD/greyhound/cache/topaz"
          for kv in ${{ github.event.inputs.env }}; do
            case "$kv" in [A-Z_]*=*) export "$kv" ;; *) echo "ignored env input: $kv" ;; esac
          done
          for s in ${{ github.event.inputs.script }}; do
            python "$s" greyhound/cache/topaz "${{ github.event.inputs.label }}" | tee -a report.md | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.mode == 'run'
        with:
          name: topaz-report-${{ github.run_id }}
          path: report.md
          if-no-files-found: ignore

      - name: Refuse to store Topaz data anywhere but a private repository
        if: github.event.inputs.mode == 'pull'
        run: |
          # GRV's API is "for personal use only". A release on a public repository can be downloaded by anyone, so
          # storing Topaz files there would publish GRV's data. The probe (column names and fill rates only) is allowed.
          if [ -z "$GH_TOKEN" ]; then
            echo "Refused: the GREYHOUND_DATA_TOKEN secret is not set (research/greyhound/README.md, Topaz storage)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$GH_REPO" = "${{ github.repository }}" ]; then
            echo "Refused: GREYHOUND_DATA_REPO points at this public repository." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          VIS=$(gh repo view "$GH_REPO" --json visibility -q .visibility) || { echo "Refused: cannot read $GH_REPO with GREYHOUND_DATA_TOKEN." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          if [ "$VIS" != "PRIVATE" ]; then
            echo "Refused: $GH_REPO is $VIS. Topaz data must go to a private repository." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Topaz files go to the topaz-history release of $GH_REPO (private)."

      - name: Fetch what the release already holds
        if: github.event.inputs.mode == 'pull'
        run: |
          gh release view topaz-history >/dev/null 2>&1 || gh release create topaz-history --latest=false \
            --title "Topaz history" --notes "GRV Topaz bulk runs, personal use only, one gzipped JSON per state and month (Fk-model research/greyhound/README.md). Written by Fk-model's gh topaz workflow; do not delete or make public."
          mkdir -p greyhound/cache/topaz
          gh release download topaz-history --dir greyhound/cache/topaz --pattern 'runs_*.json.gz' --skip-existing || true

      - name: Pull
        if: github.event.inputs.mode == 'pull'
        run: |
          touch /tmp/before-pull
          TO_ARG=""; [ -n "${{ github.event.inputs.to }}" ] && TO_ARG="--to ${{ github.event.inputs.to }}"
          python -m greyhound.pull --states "${{ github.event.inputs.states }}" --from "${{ github.event.inputs.from }}" $TO_ARG \
            --refresh "${{ github.event.inputs.refresh }}" --max-calls "${{ github.event.inputs.max_calls }}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}

      - name: Upload to the release
        if: github.event.inputs.mode == 'pull'
        run: |
          # only the files this run wrote; the held ones are already on the release
          NEW=$(find greyhound/cache/topaz -name 'runs_*.json.gz' -newer /tmp/before-pull)
          [ -n "$NEW" ] || { echo "nothing new to upload"; exit 0; }
          gh release upload topaz-history $NEW --clobber
