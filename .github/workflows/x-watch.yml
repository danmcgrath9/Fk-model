name: x watch (shadow)

# Reads a tipster's new posts from the X API, parses the tips (the card image is read by OCR) and records what it
# WOULD bet. SHADOW ONLY (founder, 18 Nov 2026: "Don't do it live until I say it"): no BetMatic login, no bets.
# A post with tips is raised as an issue so it is seen. Half a US cent a post read; an empty check is free.
on:
  schedule:
    - cron: '*/10 21-23,0-8 * * *'      # every 10 minutes, 8am to 7pm Melbourne (daylight time)
  workflow_dispatch:
    inputs:
      user:
        description: 'X username to watch'
        default: 'AnthonyDon_'

permissions:
  contents: write
  issues: write

concurrency:
  group: x-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: twitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read new posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/x_watch.py "${{ github.event.inputs.user || 'AnthonyDon_' }}" --unit 50
      - name: Raise the tips as an issue
        if: hashFiles('data/x-watch/new-tips.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="Don tips (shadow): $(grep -m1 '^- ' data/x-watch/new-tips.md | cut -c3-90)"
          gh issue create --title "$T" --body-file data/x-watch/new-tips.md || echo "could not raise the issue"
          rm -f data/x-watch/new-tips.md
      - name: Keep the state and the log
        run: |
          git config user.name "x watch" && git config user.email "actions@users.noreply.github.com"
          git add data/x-watch/*.json data/x-watch/*.jsonl 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "x watch: new posts read (shadow)" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done; }
