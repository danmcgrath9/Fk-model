name: aleague data

# A-League Men data (aleague/README.md). Step 1, the inventory: one look at each candidate source and
# its terms, results kept on the aleague-history release. Separate from every fk-*, nba-* and afl-*
# workflow: its own concurrency group, no Form King key, no BetMatic, no database, no paid service.

on:
  workflow_dispatch:
  push:
    branches: [aleague-model]
    paths:
      - 'aleague/data/**'
      - '.github/workflows/aleague-data.yml'

concurrency:
  group: aleague-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PAUSE: '8'
      # set the repository variable ALEAGUE_CONTACT to add a way to reach us to the User-Agent
      ALEAGUE_UA: fk-model A-League research ${{ vars.ALEAGUE_CONTACT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r aleague/requirements.txt

      - name: Inventory (one look per source)
        run: |
          set -o pipefail
          python aleague/data/inventory.py --out aleague/cache/inventory
          gh release view aleague-history >/dev/null 2>&1 || gh release create aleague-history --target main --latest=false \
            --title "A-League Men history" --notes "A-League Men data (aleague/README.md). Written by the aleague-* workflows; do not delete." || true
          tar czf inventory_v1.tar.gz -C aleague/cache inventory
          gh release upload aleague-history inventory_v1.tar.gz --clobber
