name: aleague data

# A-League Men data (aleague/README.md). Step 1, the inventory: one look at each candidate source and
# its terms. Then the raw results sources, pulled once. Everything is kept on the aleague-history release
# and never pulled twice. Separate from every fk-*, nba-* and afl-*
# workflow: its own concurrency group, no Form King key, no BetMatic, no database, no paid service.

on:
  workflow_dispatch:
    inputs:
      refresh_current:
        description: 'yes = re-fetch the current season from Wikipedia (in-season update), then rebuild the tables'
        default: 'no'
  push:
    branches: [aleague-model]
    paths:
      - 'aleague/data/**'
      - '.github/workflows/aleague-data.yml'

concurrency:
  group: aleague-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PAUSE: '8'
      # Wikipedia API etiquette: identify, batch, and pause; 3 s is ample for a few dozen requests
      WIKI_PAUSE: '3'
      # set the repository variable ALEAGUE_CONTACT to add a way to reach us to the User-Agent
      ALEAGUE_UA: fk-model A-League research ${{ vars.ALEAGUE_CONTACT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r aleague/requirements.txt

      - name: Release
        run: |
          gh release view aleague-history >/dev/null 2>&1 || gh release create aleague-history --target main --latest=false \
            --title "A-League Men history" --notes "A-League Men data (aleague/README.md). Written by the aleague-* workflows; do not delete." || true
          gh release view aleague-history --json assets --jq '.assets[].name' > held.txt
          echo "release holds: $(tr '\n' ' ' < held.txt)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Inventory (one look per source, once)
        run: |
          if grep -qx inventory_v1.tar.gz held.txt; then echo "inventory v1 held, not repeated"; exit 0; fi
          set -o pipefail
          python aleague/data/inventory.py --out aleague/cache/inventory
          tar czf inventory_v1.tar.gz -C aleague/cache inventory
          gh release upload aleague-history inventory_v1.tar.gz --clobber

      - name: Inventory, second look (aussportsbetting, Ultimate A-League), once
        run: |
          if grep -qx inventory2_v1.tar.gz held.txt; then echo "inventory 2 held, not repeated"; exit 0; fi
          set -o pipefail
          python aleague/data/inventory2.py --out aleague/cache/inventory2
          tar czf inventory2_v1.tar.gz -C aleague/cache inventory2
          gh release upload aleague-history inventory2_v1.tar.gz --clobber

      - name: Inventory, third look (Ultimate A-League integration and match pages), once
        run: |
          if grep -qx inventory3_v1.tar.gz held.txt; then echo "inventory 3 held, not repeated"; exit 0; fi
          set -o pipefail
          python -m aleague.data.inventory3 --out aleague/cache/inventory3
          tar czf inventory3_v1.tar.gz -C aleague/cache inventory3
          gh release upload aleague-history inventory3_v1.tar.gz --clobber

      - name: Results sources (FBref results mirror on GitHub, Wikipedia season pages), once
        run: |
          if grep -qx results_raw_v1.tar.gz held.txt; then echo "results raw v1 held, not re-pulled"; exit 0; fi
          set -o pipefail
          mkdir -p aleague/cache/raw
          # worldfootballR's own GitHub release of FBref results (no request to FBref)
          curl -sSfL -o aleague/cache/raw/AUS_match_results.rds \
            https://github.com/JaseZiv/worldfootballR_data/releases/download/match_results/AUS_match_results.rds
          python aleague/data/wiki_fetch.py --out aleague/cache/raw/wiki | tee -a "$GITHUB_STEP_SUMMARY"
          tar czf results_raw_v1.tar.gz -C aleague/cache raw
          gh release upload aleague-history results_raw_v1.tar.gz --clobber

      - name: Tables (matches, goals, team games) built from the raw sources
        run: |
          set -o pipefail
          rm -rf aleague/cache/raw && mkdir -p aleague/cache
          gh release download aleague-history --pattern results_raw_v1.tar.gz --dir aleague/cache --clobber
          tar xzf aleague/cache/results_raw_v1.tar.gz -C aleague/cache
          if [ "${{ github.event.inputs.refresh_current }}" = "yes" ]; then
            # the season in play: Wikipedia only, a handful of requests; replaces that season's pages
            cur=$(python -c "import datetime as d; t=d.date.today(); y=t.year if t.month>=7 else t.year-1; print(f'{y}–{str(y+1)[2:]}')")
            python aleague/data/wiki_fetch.py --out aleague/cache/raw/wiki --seasons "$cur" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python -m aleague.data.build aleague/cache/raw aleague/cache/tables | tee -a "$GITHUB_STEP_SUMMARY"
          python -m aleague.data.team_games aleague/cache/tables | tee -a "$GITHUB_STEP_SUMMARY"
          python -m pytest -q aleague/tests | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
          for f in matches.parquet goals.parquet team_games.parquet BUILD.md; do
            gh release upload aleague-history "aleague/cache/tables/$f" --clobber
          done
