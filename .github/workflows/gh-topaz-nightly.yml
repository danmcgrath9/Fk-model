name: gh topaz nightly

# Founder, 5 Nov 2026: "train it every week overnight", and price the next day's card the night before.
#   Sunday 8:23pm Melbourne: train the model on every resulted VIC race and save it (Actions cache, readable only by
#                            this repository's own runs).
#   Every night 10:17pm Melbourne: load the saved model and price TOMORROW's VIC card (Topaz has it up by the evening),
#                            sealed in the log (greyhound/sealed.py), because this repository's logs are public.
# The crons are in UTC, set for AEDT (UTC+11): the train Sunday 8:23pm, the price every night 10:17pm Melbourne; from
# April (AEST, UTC+10) they run an hour earlier in Melbourne. Off the hour on purpose: the 5 Nov 10pm (minute 0) run
# never started, and GitHub delays or drops scheduled runs at the top of the hour; the train ends well before the price.
# Nothing is bet: the card is the founder's to read.
# 17 Nov 2026 (founder: "Yep build it, track both 1.1x and 1.2x"): the corrected blend (Tests 80 and 81,
# research/greyhound/topaz_iso.py) rides beside the card, paper only. Every night the Isolynx pull is topped up and
# tomorrow's runners are priced by ours with Isolynx (card_iso, kept with the card); the weekly train also fits ours
# with Isolynx and the correction (mode=train_iso does only that). The card's own model, rule and page are unchanged.

on:
  schedule:
    - cron: '23 9 * * 0'
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'train (fit and save the model, then ours with Isolynx and the correction), train_iso (only ours with Isolynx and the correction), or price (tomorrow, or the date below, with the saved model)'
        default: 'price'
      date:
        description: 'mode=price: YYYY-MM-DD to price; blank = tomorrow in Melbourne'
        default: ''
      tracks:
        description: 'mode=price: tracks to seal in full, comma separated (blank = every VIC track)'
        default: ''
      history_from:
        description: 'mode=price: build the form from this month on, YYYY-MM, or all (blank = 2020-01: 5 Nov check, 47 of 48 top picks the same, chances 0.45% apart on average)'
        default: ''
      compare_from:
        description: 'mode=price: also build from this month (YYYY-MM) and print how far the two builds price the card apart'
        default: ''

concurrency:
  group: gh-topaz-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      TOPAZ_API_KEY: ${{ secrets.TOPAZ_API_KEY }}
      TOPAZ_TERMS_READ: ${{ vars.TOPAZ_TERMS_READ }}
      MODE: ${{ github.event.schedule == '23 9 * * 0' && 'train' || github.event.inputs.mode || 'price' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31' pandas numpy lightgbm scikit-learn scipy

      - name: Restore the pulled months (Actions cache, this repository only)
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/topaz
          key: topaz-VIC-${{ github.run_id }}
          restore-keys: topaz-VIC-

      - name: Bring the runs and race records up to yesterday
        run: |
          set -o pipefail
          python -m greyhound.pull --states VIC --from 2013-01 --by-day --workers 8 --per-minute 72 --max-calls 100000 --max-minutes 60 | tail -3
          python -m greyhound.pull --races --states VIC --from 2013-01 --workers 8 --per-minute 72 --max-calls 100000 --max-minutes 30 | tail -3

      - name: Save the pulled months (Actions cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: greyhound/cache/topaz
          key: topaz-VIC-${{ github.run_id }}

      - name: Restore the Isolynx pull (Actions cache, this repository only)
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/isolynx
          key: topaz-isolynx-${{ github.run_id }}
          restore-keys: topaz-isolynx-

      - name: Top up the Isolynx pull (the dogs with a tracked run in the last four days; counts only)
        if: env.MODE == 'price' && hashFiles('greyhound/cache/isolynx/*') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          python -m greyhound.isolynx topup --runs greyhound/cache/topaz --out greyhound/cache/isolynx \
            --since "$(TZ=Australia/Melbourne date -d '-4 days' +%F)" --day "$(TZ=Australia/Melbourne date +%F)" \
            --max-minutes 20 | tail -2

      - name: Save the Isolynx pull (Actions cache)
        if: always() && env.MODE == 'price' && hashFiles('greyhound/cache/isolynx/*') != ''
        uses: actions/cache/save@v4
        with:
          path: greyhound/cache/isolynx
          key: topaz-isolynx-${{ github.run_id }}

      - name: Betfair's free ANZ greyhound files (BSP, the training label)
        if: env.MODE == 'train' || env.MODE == 'train_iso'
        run: |
          mkdir -p bf
          for f in ANZ_Greyhounds_2020.zip ANZ_Greyhounds_2021.zip ANZ_Greyhounds_2022.zip ANZ_Greyhounds_2023.zip \
                   ANZ_Greyhounds_2024.zip ANZ_Greyhounds_2025.zip $(for m in 01 02 03 04 05 06 07 08 09 10 11 12; do echo ANZ_Greyhounds_2026_$m.csv; done); do
            curl -fsSL --retry 3 -o "bf/$f" "https://betfair-datascientists.github.io/data/assets/$f" 2>/dev/null \
              && echo "$f $(stat -c %s "bf/$f") bytes" || { rm -f "bf/$f"; echo "not published: $f"; }
          done

      - name: Restore the saved model (Actions cache)
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/model
          key: topaz-model-${{ github.run_id }}
          restore-keys: topaz-model-

      - name: Restore the kept cards (Actions cache, this repository only; for gh topaz track and the correction)
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/cards
          key: topaz-cards-${{ github.run_id }}
          restore-keys: topaz-cards-

      - name: Restore the Betwatch price history (Actions cache, read only; the correction's training races, and the band sheet's market inputs)
        if: env.MODE == 'train' || env.MODE == 'train_iso' || env.MODE == 'price'
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/betwatch
          key: betwatch-VIC-G-${{ github.run_id }}
          restore-keys: betwatch-VIC-G-

      - name: Restore the research walks (Actions cache, read only; ours with Isolynx out of sample, copied once)
        if: env.MODE == 'train' || env.MODE == 'train_iso'
        uses: actions/cache/restore@v4
        with:
          path: greyhound/cache/walk
          key: walk-${{ github.run_id }}
          restore-keys: walk-

      - name: Train, or price tomorrow's card
        if: env.MODE != 'train_iso'
        run: |
          set -o pipefail
          [ -d bf ] && export BETFAIR_DIR="$PWD/bf"
          export RACES_DIR="$PWD/greyhound/cache/topaz" WALK_GRV_RATING=yes WALK_ROUNDS_A=4000 MODEL_DIR="$PWD/greyhound/cache/model"
          # Tests 27 and 28: the reliable-beginner inputs and the lead chance; the price run reads the weekly train's
          # saved lead model (the train itself forward-chains its own and ignores this)
          export WALK_RELIABLE=yes WALK_LEAD=yes WALK_LEAD_MODEL="$PWD/greyhound/cache/model/lead.txt"
          # Tests 32 and 38: races without a BSP on every runner (label partly GRV's SP chance) at half weight; Tests 33
          # and 43: track character (the price run's align drops it until a train has fitted it)
          export WALK_SP_WEIGHT=0.5 WALK_TRACK=yes
          if [ "$MODE" = "train" ]; then
            PRICE_MODE=train python research/greyhound/topaz_price_upcoming.py greyhound/cache/topaz "topaz VIC weekly train" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            DAY="${{ github.event.inputs.date }}"; [ -n "$DAY" ] || DAY=$(TZ=Australia/Melbourne date -d tomorrow +%F)
            # the card is also kept (race, dog, our chance, GRV's price) for the live tracker, gh topaz track
            # the corrected blend's card (paper only) is kept beside it when the Isolynx pull is here
            [ -d greyhound/cache/isolynx ] && export ISO_DIR="$PWD/greyhound/cache/isolynx"
            # the band sheet (Test 101, paper only) reads each dog's earlier runs in the Betwatch history, as the best
            # model does at TAB's open
            [ -d greyhound/cache/betwatch ] && export BETWATCH_DIR="$PWD/greyhound/cache/betwatch"
            PRICE_CARD_DIR="$PWD/greyhound/cache/cards" PRICE_DAY="$DAY" PRICE_TRACK="${{ github.event.inputs.tracks }}" \
              PRICE_HISTORY_FROM="${{ github.event.inputs.history_from || '2020-01' }}" PRICE_COMPARE_FROM="${{ github.event.inputs.compare_from }}" \
              python research/greyhound/topaz_price_upcoming.py greyhound/cache/topaz "topaz VIC prices for $DAY"
          fi

      - name: Train ours with Isolynx and the corrected blend (paper only; never stops the card's model being saved)
        if: env.MODE == 'train' || env.MODE == 'train_iso'
        continue-on-error: true
        run: |
          set -o pipefail
          [ -d bf ] && export BETFAIR_DIR="$PWD/bf"
          export RACES_DIR="$PWD/greyhound/cache/topaz" WALK_GRV_RATING=yes WALK_ROUNDS_A=4000 MODEL_DIR="$PWD/greyhound/cache/model"
          export WALK_RELIABLE=yes WALK_LEAD=yes WALK_SP_WEIGHT=0.5 WALK_TRACK=yes
          export ISO_DIR="$PWD/greyhound/cache/isolynx" BETWATCH_DIR="$PWD/greyhound/cache/betwatch" \
                 WALK_CACHE_DIR="$PWD/greyhound/cache/walk" CARDS_DIR="$PWD/greyhound/cache/cards"
          PRICE_MODE=train_iso python research/greyhound/topaz_price_upcoming.py greyhound/cache/topaz "topaz VIC weekly train, ours with Isolynx" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the card (Actions cache; race, dog, our chance and GRV's price only)
        if: env.MODE == 'price' && hashFiles('greyhound/cache/cards/*') != ''
        uses: actions/cache/save@v4
        with:
          path: greyhound/cache/cards
          key: topaz-cards-${{ github.run_id }}

      - name: Save the trained model (Actions cache)
        if: env.MODE == 'train' || env.MODE == 'train_iso'
        uses: actions/cache/save@v4
        with:
          path: greyhound/cache/model
          key: topaz-model-${{ github.run_id }}
