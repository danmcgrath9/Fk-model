name: fk betmatic

# Sends a BetMatic pre-open order file as Market Open bets (or cancels them, or reads back what was placed), from
# GitHub instead of the founder's PC: the PC only runs the BetMatic bot that actually places the bets at the open.
# The job runs in the "betmatic" environment, which needs the founder's approval in GitHub before it starts and holds
# the BetMatic login as environment secrets, so nothing is sent (and the login cannot be read) until he approves.
# Claude prepares the order file and starts this workflow; the founder's approval is the send. (14 Oct 2026.)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'what to do (check = read the account only, never bets)'
        type: choice
        options: [check, send, pending, status, summary, cancel]
        default: 'check'
      file:
        description: 'send: the order file (data/live_bets/DAYPREFIX-betmatic-preopen.csv); cancel/status/pending/summary: its -ledger.csv (summary also takes a bare YYYY-MM-DD)'
        default: ''
      unit:
        description: 'send: dollars a unit (founder, 16 Oct: $100 from Moe Sun 18 Oct on; was $75)'
        default: '100'
      race:
        description: 'cancel: only this race (blank = every bet in the ledger)'
        default: ''
      number:
        description: 'cancel: only this saddlecloth number in that race'
        default: ''
      when:
        description: "send: 'open' = fire at the market's open (normal); 'now' = place straight away on a market already up (test bets)"
        type: choice
        options: [open, now]
        default: 'open'
      dry_run:
        description: 'yes = print exactly what would be sent, send nothing'
        default: 'yes'
      tag:
        description: "send: label suffix for a resend after the first set already fired and can't be cancelled (e.g. b); blank normally"
        default: ''

permissions:
  contents: write

# No concurrency group (15 Oct 2026): GitHub keeps only ONE waiting run per group and silently cancels the older one
# when another is queued, which is how Wodonga's first live send was lost behind Horsham's. Sends are independent
# (each bet has its own label) and the ledger commit pulls before it pushes, so runs may overlap.

jobs:
  run:
    runs-on: ubuntu-latest
    environment: betmatic
    timeout-minutes: 20
    env:
      BETMATIC_EMAIL: ${{ secrets.BETMATIC_EMAIL }}
      BETMATIC_PASSWORD: ${{ secrets.BETMATIC_PASSWORD }}
      SESSION: ${{ secrets.BETMATIC_TAB_SESSION }}
      A: ${{ github.event.inputs.action }}
      FILE: ${{ github.event.inputs.file }}
      UNIT: ${{ github.event.inputs.unit }}
      RACE: ${{ github.event.inputs.race }}
      NUM: ${{ github.event.inputs.number }}
      DRY: ${{ github.event.inputs.dry_run }}
      WHEN: ${{ github.event.inputs.when }}
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: BetMatic
        run: |
          set -e
          # The secrets must live in the "betmatic" environment of this repo. An empty value means they are somewhere
          # else (another environment name, Codespaces or Dependabot secrets): stop with a plain message, never a traceback.
          [ -n "$BETMATIC_EMAIL" ] && [ -n "$BETMATIC_PASSWORD" ] || { echo "BETMATIC_EMAIL / BETMATIC_PASSWORD are empty: add them under Settings > Environments > betmatic > Environment secrets"; exit 1; }
          case "$A" in check|summary) ;; *) [ -n "$FILE" ] || { echo "action $A needs a file"; exit 1; } ;; esac
          SEND=""; [ "$DRY" = "yes" ] || SEND="--send"
          case "$A" in
            check)  python betmatic/betmatic_send.py check ;;
            send)   NOW=""; [ "$WHEN" = "now" ] && NOW="--now"
                    python betmatic/betmatic_send.py send "$FILE" --unit "$UNIT" --session "$SESSION" ${TAG:+--tag "$TAG"} $NOW $SEND ;;
            cancel) python betmatic/betmatic_send.py cancel "$FILE" ${RACE:+--race "$RACE"} ${NUM:+--number "$NUM"} $SEND ;;
            status) python betmatic/betmatic_send.py status "$FILE" ;;
            pending) python betmatic/betmatic_send.py pending "$FILE" ;;
            summary)
              D=$(basename "$FILE" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')
              case "$FILE" in *.csv) python betmatic/betmatic_send.py summary "$D" --ledger "$FILE" ;;
                              *) python betmatic/betmatic_send.py summary "$D" ;; esac ;;
            *) echo "unknown action $A"; exit 1 ;;
          esac
      - name: Keep the ledger and placements
        if: always()
        run: |
          git config user.name "fk-betmatic"; git config user.email "actions@users.noreply.github.com"
          # one file at a time: a pattern that matches nothing (no -placed.jsonl before the first status) made the whole
          # add fail silently, so the first live send's ledger was never kept (15 Oct 2026)
          for f in data/live_bets/*-ledger.csv data/live_bets/*-placed.jsonl data/live_bets/*-deductions-actual.txt; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -m "BetMatic $A: $FILE"; for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i*3)); done; }
