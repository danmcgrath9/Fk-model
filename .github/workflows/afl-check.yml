# One look at the terms of the sites that could give us named teams each week, so we read them before building on any.
# A handful of page loads, once per push of this file. Nothing is stored beyond the run's log and artifact.
name: afl check terms
on:
  push:
    branches: [afl-props]
    paths: ['.github/workflows/afl-check.yml']
concurrency:
  group: afl-check
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  terms:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch terms, robots.txt and API notes
        env:
          UA: "fk-model AFL research (${{ vars.AFL_CONTACT }})"
        run: |
          mkdir -p out
          get() { echo "== $1"; curl -sSL -A "$UA" --max-time 30 "$1" -o "out/$2" -w "%{http_code} %{url_effective}\n" || true; sleep 5; }
          get https://www.afl.com.au/robots.txt afl_robots.txt
          get https://www.afl.com.au/ afl_home.html
          for p in $(grep -oiE 'href="[^"]*(terms|legal|conditions|privacy)[^"]*"' out/afl_home.html | sed -E 's/href="//; s/"$//' | sort -u | head -6); do
            case "$p" in http*) u="$p";; *) u="https://www.afl.com.au$p";; esac
            get "$u" "afl_$(echo "$p" | tr -c 'a-zA-Z0-9' '_' | cut -c1-60).html"
          done
          get https://www.footywire.com/robots.txt footywire_robots.txt
          get https://www.footywire.com/afl/footy/afl_team_selections footywire_selections.html
          get https://api.squiggle.com.au/ squiggle_api.html
          get https://www.espn.com.au/robots.txt espn_robots.txt
          for f in out/*.html; do
            python3 - "$f" <<'PY'
          import re, sys, html
          t = open(sys.argv[1], errors='ignore').read()
          t = html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>', ' ', t, flags=re.S))
          t = re.sub(r'\s+', ' ', t)
          print('####', sys.argv[1], len(t), 'chars of text')
          for m in re.finditer(r'[^.]{0,300}(scrap|robot|spider|crawl|automat|data min|harvest|commercial|reproduc|lineup|team selection)[^.]{0,300}\.', t, re.I):
              print('  >', m.group(0).strip()[:700])
          PY
          done
          for f in out/*robots.txt; do echo "#### $f"; head -60 "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: terms
          path: out
