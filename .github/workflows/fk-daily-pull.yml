name: fk daily pull

# Pulls tomorrow's Victorian meetings from Form King every evening, builds the form
# reports and posts phone links in the run summary. This is the horse model's own repository.
#
# Safety, in order:
#   * runs on the FREE test key until the repository variable FK_LIVE is set to "true";
#   * on the live key the per-run credit cap (FK_MAX_CREDITS_PER_RUN, 600) and the
#     balance floor (FK_MIN_BALANCE, 1000) stop a run before its first paid call;
#   * the credit ledger lives in the fk-model Supabase project, so it survives the runner.
#
# Secrets (repo Settings > Secrets and variables > Actions), all for the fk-model
# Supabase project, never TrueK's:
#   FK_API_KEY, FK_DATABASE_URL, FK_SUPABASE_URL, FK_SUPABASE_SERVICE_ROLE_KEY
# Variable: FK_LIVE = "true" to switch from the test key to the live key.

on:
  schedule:
    - cron: '30 8 * * *'   # 18:30 Melbourne in standard time, 19:30 in daylight saving
  workflow_dispatch:
    inputs:
      key:
        description: 'test or live (live also needs FK_LIVE=true)'
        default: 'test'
      date:
        description: 'meeting date YYYY-MM-DD (default: tomorrow, Melbourne)'
        default: ''

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.FK_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FK_SUPABASE_SERVICE_ROLE_KEY }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Decide which key
        id: key
        run: |
          WANT="${{ github.event.inputs.key || 'live' }}"
          if [ "$WANT" = "live" ] && [ "${{ vars.FK_LIVE }}" = "true" ]; then
            echo "key=live" >> "$GITHUB_OUTPUT"
            echo "Live key: FK_LIVE is true." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "key=test" >> "$GITHUB_OUTPUT"
            echo "Test key (FK-TEST-API-KEY). Set the repository variable FK_LIVE=true to go live." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the spec is present
        run: test -f b2c-openapi.yaml || { echo "b2c-openapi.yaml is missing. Upload it to the repository root on GitHub (Add file > Upload files)."; exit 1; }

      - name: Spec report
        run: python scripts/spec_report.py

      - name: Daily pull
        env:
          FK_API_KEY: ${{ steps.key.outputs.key == 'live' && secrets.FK_API_KEY || 'FK-TEST-API-KEY' }}
        run: |
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          python scripts/daily_pull.py --key ${{ steps.key.outputs.key }} --yes $DATE_ARG

      - name: Build reports
        run: |
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          python scripts/build_report.py --no-open $DATE_ARG

      - name: Ledger
        if: always()
        run: python scripts/ledger.py show --limit 30 > ledger.txt; cat ledger.txt

      # Optional: needs FK_SUPABASE_URL and FK_SUPABASE_SERVICE_ROLE_KEY. Without them the
      # reports are still attached to the run as a downloadable zip (the step below).
      - name: Publish links
        if: always() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: python scripts/publish_report.py --summary "$GITHUB_STEP_SUMMARY" --ledger-lines ledger.txt

      - name: Credits in the summary
        if: always() && (env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '')
        run: |
          echo '## Reports' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the fk-reports zip under Artifacts below and open the .html inside it.' >> "$GITHUB_STEP_SUMMARY"
          echo '## Credits' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ledger.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fk-reports
          path: reports/*.html
          if-no-files-found: ignore
