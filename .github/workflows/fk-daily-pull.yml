name: fk daily pull

# Pulls tomorrow's Victorian meetings from Form King every evening, builds the form
# reports and posts phone links in the run summary. This is the horse model's own repository.
#
# Safety, in order:
#   * runs on the FREE test key until the repository variable FK_LIVE is set to "true";
#   * on the live key the per-run credit cap (FK_MAX_CREDITS_PER_RUN, 600) and the
#     balance floor (FK_MIN_BALANCE, default 1000) stop a run before its first paid call;
#   * the credit ledger lives in the fk-model Supabase project, so it survives the runner.
#
# Secrets (repo Settings > Secrets and variables > Actions), all for the fk-model
# Supabase project, never TrueK's:
#   FK_API_KEY, FK_DATABASE_URL, FK_SUPABASE_URL, FK_SUPABASE_SERVICE_ROLE_KEY
# Variable: FK_LIVE = "true" to switch from the test key to the live key.

on:
  # PAUSED 4 Oct 2026 until the credit reset on 11 Oct: the floor is down to 100 so the month's last credits can be
  # spent on meetings asked for by hand, and an automatic pull of every Victorian meeting would spend them all.
  schedule:
    - cron: '30 8 * * *'   # 18:30 Melbourne in standard time, 19:30 in daylight saving
    - cron: '0 11 * * *'   # catch-up at 21:00 Melbourne
  workflow_dispatch:
    inputs:
      key:
        description: 'test or live (live also needs FK_LIVE=true)'
        default: 'test'
      date:
        description: 'meeting date YYYY-MM-DD (default: tomorrow, Melbourne)'
        default: ''
      rebuild_only:
        description: 'yes = rebuild the reports from stored data, no Form King calls, no credits'
        default: 'no'
      track:
        description: 'only this track (e.g. Ballarat); a past date pulls that day by date'
        default: ''
      races:
        description: 'only these race numbers, comma separated (e.g. 1,3)'
        default: ''
      horse:
        description: 'only the race this horse ran in (name as Form King spells it); skips speedmaps and profiles'
        default: ''
      paper:
        description: 'yes = also log the paper book bets for the day being built, then settle and report'
        default: 'no'
      exclude_run:
        description: "what-if: leave a horse's run out of every figure, NAME@YYYY-MM-DD (comma separated); writes a -whatif page, places no bets"
        default: ''
      all_statuses:
        description: 'yes = pull meetings Form King has not yet marked FINAL_FIELDS (e.g. still at WEIGHTS)'
        default: 'no'
      force:
        description: 'yes = re-fetch races already fetched in the last 12 hours (e.g. weights-stage entries now at final fields)'
        default: 'no'
      max_credits:
        description: 'optional: credit cap for this run only (overrides FK_MAX_CREDITS_PER_RUN), e.g. to split a low balance across meetings'
        required: false
      min_balance:
        description: 'optional: balance floor for this run only (overrides FK_MIN_BALANCE)'
        required: false
      odds_only:
        description: 'yes = only refresh the prices (one Meeting Summary per meeting, 5 credits) for the date(s) given, comma separated, and rebuild them'
        default: 'no'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: write   # to push the built reports to the `reports` branch

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.FK_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FK_SUPABASE_SERVICE_ROLE_KEY }}
      FK_MAX_CREDITS_PER_RUN: ${{ github.event.inputs.max_credits || vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ github.event.inputs.min_balance || vars.FK_MIN_BALANCE || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Decide which key
        id: key
        run: |
          WANT="${{ github.event.inputs.key || 'live' }}"
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$WANT" = "live" ] && [ "$LIVE_FLAG" = "true" ]; then
            echo "key=live" >> "$GITHUB_OUTPUT"
            echo "Live key: FK_LIVE is true." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "key=test" >> "$GITHUB_OUTPUT"
            echo "Test key (FK-TEST-API-KEY). Set the repository variable FK_LIVE=true to go live." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the spec is present
        run: test -f b2c-openapi.yaml || { echo "b2c-openapi.yaml is missing. Upload it to the repository root on GitHub (Add file > Upload files)."; exit 1; }

      - name: Spec report
        run: python scripts/spec_report.py

      - name: Refresh prices only
        if: github.event.inputs.odds_only == 'yes'
        env:
          FK_API_KEY: ${{ steps.key.outputs.key == 'live' && secrets.FK_API_KEY || 'FK-TEST-API-KEY' }}
        run: |
          for D in $(echo "${{ github.event.inputs.date }}" | tr ',' ' '); do
            python scripts/morning_odds.py --key ${{ steps.key.outputs.key }} --yes --date "$D"
            python scripts/build_report.py --no-open --date "$D"
          done

      - name: Daily pull
        if: github.event.inputs.rebuild_only != 'yes' && github.event.inputs.odds_only != 'yes'
        env:
          FK_API_KEY: ${{ steps.key.outputs.key == 'live' && secrets.FK_API_KEY || 'FK-TEST-API-KEY' }}
        run: |
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          [ -n "${{ github.event.inputs.track }}" ] && DATE_ARG="$DATE_ARG --track ${{ github.event.inputs.track }}"
          [ -n "${{ github.event.inputs.races }}" ] && DATE_ARG="$DATE_ARG --races ${{ github.event.inputs.races }}"
          [ -n "${{ github.event.inputs.horse }}" ] && DATE_ARG="$DATE_ARG --no-speedmaps --no-profiles --horse \"${{ github.event.inputs.horse }}\""
          [ "${{ github.event.inputs.all_statuses }}" = "yes" ] && DATE_ARG="$DATE_ARG --all-statuses"
          [ "${{ github.event.inputs.force }}" = "yes" ] && DATE_ARG="$DATE_ARG --force"
          eval python scripts/daily_pull.py --key ${{ steps.key.outputs.key }} --yes $DATE_ARG

      - name: Build reports
        if: github.event.inputs.odds_only != 'yes'
        env:
          EXCLUDE_RUN: ${{ github.event.inputs.exclude_run }}
        run: |
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          [ -n "${{ github.event.inputs.track }}" ] && DATE_ARG="$DATE_ARG --track ${{ github.event.inputs.track }}"
          [ "${{ github.event.inputs.paper }}" = "yes" ] && DATE_ARG="$DATE_ARG --paper"
          if [ -n "$EXCLUDE_RUN" ]; then
            python scripts/build_report.py --no-open $DATE_ARG --exclude-run "$EXCLUDE_RUN"
          else
            python scripts/build_report.py --no-open $DATE_ARG
          fi
          if [ "${{ github.event.inputs.paper }}" = "yes" ]; then
            python scripts/paper_settle.py | tee -a "$GITHUB_STEP_SUMMARY"
            python scripts/paper_report.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ledger
        if: always()
        run: python scripts/ledger.py show --limit 30 > ledger.txt; cat ledger.txt

      # Optional: needs FK_SUPABASE_URL and FK_SUPABASE_SERVICE_ROLE_KEY. Without them the
      # reports are still attached to the run as a downloadable zip (the step below).
      - name: Publish links
        if: always() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: python scripts/publish_report.py --summary "$GITHUB_STEP_SUMMARY" --ledger-lines ledger.txt

      - name: Credits in the summary
        if: always() && (env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '')
        run: |
          echo '## Reports' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the fk-reports zip under Artifacts below and open the .html inside it.' >> "$GITHUB_STEP_SUMMARY"
          echo '## Credits' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ledger.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fk-reports
          path: reports/*.html
          if-no-files-found: ignore

      # The latest reports also live on the `reports` branch: an orphan branch replaced on
      # every run (force push, one commit), so the repository never grows with old pages.
      - name: Push reports to the reports branch
        if: always()
        run: |
          ls reports/*.html >/dev/null 2>&1 || { echo "no reports to push"; exit 0; }
          # The branch keeps every report ever built (one file per meeting and day); this run's
          # files replace their own names and leave the rest, so a past day pulled on its own
          # never wipes tomorrow's card. A fresh clone is used when the branch does not exist yet.
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/reports-branch
          if git clone -q --depth 1 --branch reports "$REMOTE" /tmp/reports-branch 2>/dev/null; then
            cd /tmp/reports-branch
          else
            mkdir /tmp/reports-branch && cd /tmp/reports-branch && git init -q -b reports
          fi
          git config user.name "fk daily pull" && git config user.email "actions@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE"/reports/*.html .
          printf '# Reports\n\nEvery form report built, one file per meeting and day; a rebuild replaces its own file.\n' > README.md
          git add -A && git commit -q -m "Reports built $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new to push"
          git push -q "$REMOTE" reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
