name: fk form fit

# Fits the FORM-ONLY price (scripts/fit_form_only.py): Form King's inputs, nothing from
# today's market, so a race is priced before any book opens. Chooses the feature set and
# ridge on older racing, judges it once on the newest 30%, refits on everything and commits
# config/form_price.json. No Form King calls. Also run by the Monday back-test.

on:
  workflow_dispatch: {}

concurrency:
  group: fk-form-fit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Fit the form-only price
        timeout-minutes: 30
        run: |
          set -o pipefail
          python scripts/fit_form_only.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "fk form fit" && git config user.email "actions@users.noreply.github.com"
          git add config/form_price.json
          git diff --cached --quiet && { echo "model unchanged"; exit 0; }
          git commit -q -m "Form-only price refitted to Betfair SP"
          git pull -q --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
