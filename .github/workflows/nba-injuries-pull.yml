name: nba injuries pull

# NBA only. Reads the NBA's official injury reports (free, no key) for the months listed in
# nba/injuries/request.json, one job per month, and commits nba/injuries/raw/ to this branch.
# Own concurrency group, so it never queues behind or blocks the fk-* racing workflows.
# Runs when the request file changes on this branch, or by hand. A month already saved is skipped.

on:
  push:
    branches: [claude/nba-props]
    paths: ['nba/injuries/request.json']
  workflow_dispatch:

concurrency:
  group: nba-injuries-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  months:
    runs-on: ubuntu-latest
    outputs:
      todo: ${{ steps.list.outputs.todo }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          months = json.load(open("nba/injuries/request.json"))["months"]
          todo = [m for m in months if not os.path.exists(f"nba/injuries/raw/{m}_log.csv")]
          print("todo=" + json.dumps(todo))
          EOF

  pull:
    needs: months
    if: needs.months.outputs.todo != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month: ${{ fromJson(needs.months.outputs.todo) }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nbainjuries==1.1.1
      - name: Pull ${{ matrix.month }}
        run: python nba/pull_injuries.py ${{ matrix.month }}
      - name: Commit what came back
        if: always()
        run: |
          git config user.name "nba injuries pull"
          git config user.email "actions@users.noreply.github.com"
          git add nba/injuries/raw || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "NBA: injury reports for ${{ matrix.month }} (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
