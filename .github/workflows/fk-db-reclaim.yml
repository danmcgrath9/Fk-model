name: fk db reclaim

# Takes the duplicated runners out of fk.races (sql/005) and returns the space to the disk
# (VACUUM FULL). No Form King calls, no credits. Shares the pull's concurrency group so it
# never runs while a pull or a fit holds the tables.

on:
  workflow_dispatch:

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Reclaim
        run: |
          set -o pipefail
          python scripts/db_reclaim.py | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/db_size.py | tee -a "$GITHUB_STEP_SUMMARY"
