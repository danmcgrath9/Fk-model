name: fk fields watch

# One week of watching when every state's meetings reach final fields (founder, 23 Nov 2026: "Lets check for the next
# week ... do it for every state so we know exactly when we have to do all of them"). Every 15 minutes from 6:00am to
# 10:45pm Melbourne (daylight saving), one Get Upcoming Meetings call for every state (1 credit), a row for every meeting
# whose status changed, committed to the fields-watch branch (data/schedule/fields-watch.csv) so main is not touched
# 70 times a day. About 68 credits a day, under 500 for the week. Switch it off after Mon 30 Nov.

on:
  schedule:
    - cron: '*/15 19-23 * * *'   # 6:00am to 10:45am Melbourne (UTC+11)
    - cron: '*/15 0-11 * * *'    # 11:00am to 10:45pm Melbourne
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'yes = price the call only, no network'
        default: 'no'

concurrency:
  group: fk-fields-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: '5'
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Bring in the watch file from its branch
        run: |
          git fetch -q origin fields-watch && git show origin/fields-watch:data/schedule/fields-watch.csv > /tmp/fields-watch.csv 2>/dev/null || true
      - name: Watch
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true"; exit 1; }
          DRY=""; [ "${{ github.event.inputs.dry_run }}" = "yes" ] && DRY="--dry-run"
          python scripts/fields_watch.py --out /tmp/fields-watch.csv $DRY | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit to the fields-watch branch
        if: github.event.inputs.dry_run != 'yes'
        run: |
          [ -f /tmp/fields-watch.csv ] || exit 0
          git config user.name "fk-fields-watch"; git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code origin fields-watch >/dev/null; then
            git fetch -q origin fields-watch && git checkout -q -B fields-watch origin/fields-watch
          else
            git checkout -q --orphan fields-watch && git rm -rq --cached . && git clean -fdq -e /tmp
          fi
          mkdir -p data/schedule && cp /tmp/fields-watch.csv data/schedule/fields-watch.csv
          git add data/schedule/fields-watch.csv
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "fields watch $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git push -q origin fields-watch && break; sleep 5; git pull -q --rebase origin fields-watch; done
