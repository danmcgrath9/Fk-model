name: fk db slim

# Takes the second copies out of the fk database (scripts/db_slim.py), 19 Nov 2026, when the disk
# filled and the project went read-only. Every byte it removes is first written to the PRIVATE draft
# release fk-db-backup (a draft is visible only to people with push access, never the public), and a
# fresh download of it must match the database byte for byte before anything is removed.
#
#   step = backup  write the files, upload them, download them fresh, verify. Deletes nothing.
#   step = apply   download fresh, verify again, then slim and give the disk back.
#                  Run only after a green backup run.

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'backup (safe, deletes nothing) or apply (after a green backup)'
        default: 'backup'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  slim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Refuse an unknown step
        run: |
          case "${{ github.event.inputs.step }}" in backup|apply) ;; *) echo "step must be backup or apply"; exit 1;; esac

      - name: Find or make the private draft release
        run: |
          set -euo pipefail
          ID=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="fk-db-backup") | .id' | head -1)
          if [ -z "$ID" ]; then
            [ "${{ github.event.inputs.step }}" = "backup" ] || { echo "no backup release: run step=backup first"; exit 1; }
            ID=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name=fk-db-backup -f name="fk database backup (private draft)" \
                 -F draft=true -f body="Rows removed from the fk database by scripts/db_slim.py. Licensed racing data: keep this a draft." --jq .id)
          fi
          [ "$(gh api "repos/$GH_REPO/releases/$ID" --jq .draft)" = "true" ] || { echo "fk-db-backup is not a draft: refusing, racing data must not be public"; exit 1; }
          echo "REL_ID=$ID" >> "$GITHUB_ENV"

      - name: Back up every byte the slim removes
        if: github.event.inputs.step == 'backup'
        run: |
          set -o pipefail
          python scripts/db_slim.py backup --out bk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the backup to the draft release
        if: github.event.inputs.step == 'backup'
        run: |
          set -euo pipefail
          for f in bk/*; do
            n=$(basename "$f")
            for aid in $(gh api "repos/$GH_REPO/releases/$REL_ID/assets" --jq ".[] | select(.name==\"$n\") | .id"); do
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"
            done
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
                 --data-binary @"$f" "https://uploads.github.com/repos/$GH_REPO/releases/$REL_ID/assets?name=$n" -o /dev/null
            echo "uploaded $n ($(du -h "$f" | cut -f1))"
          done

      - name: Download the backup fresh
        run: |
          set -euo pipefail
          mkdir -p fresh
          for n in manifest.json bench.jsonl.gz races.jsonl.gz; do
            aid=$(gh api "repos/$GH_REPO/releases/$REL_ID/assets" --jq ".[] | select(.name==\"$n\") | .id")
            [ -n "$aid" ] || { echo "the backup has no $n"; exit 1; }
            curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
                 "https://api.github.com/repos/$GH_REPO/releases/assets/$aid" -o "fresh/$n"
          done
          ls -la fresh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the fresh download against the database
        if: github.event.inputs.step == 'backup'
        run: |
          set -o pipefail
          python scripts/db_slim.py verify --check fresh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Slim the database and give the disk back
        if: github.event.inputs.step == 'apply'
        run: |
          set -o pipefail
          python scripts/db_slim.py apply --check fresh --yes | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/db_size.py | tee -a "$GITHUB_STEP_SUMMARY"
