name: fk paper bets

# Read-only: one day's paper bets as a table, one row per runner backed. No Form King
# calls, no credits, and outside the pull's concurrency group so it never waits on a
# long back-test or bumps a pending nightly run.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'meeting date YYYY-MM-DD'
        required: true
      track:
        description: 'only this track (blank = every track that day)'
        default: ''

permissions:
  contents: read

jobs:
  bets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Bets
        run: |
          set -o pipefail
          TRACK_ARG=""
          [ -n "${{ github.event.inputs.track }}" ] && TRACK_ARG="--track"
          python scripts/paper_bets_day.py --date "${{ github.event.inputs.date }}" $TRACK_ARG ${{ github.event.inputs.track && format('"{0}"', github.event.inputs.track) || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Which opening price the model had
        run: |
          set -o pipefail
          TRACK_ARG=""
          [ -n "${{ github.event.inputs.track }}" ] && TRACK_ARG="--track"
          python scripts/open_price_check.py --date "${{ github.event.inputs.date }}" $TRACK_ARG ${{ github.event.inputs.track && format('"{0}"', github.event.inputs.track) || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
