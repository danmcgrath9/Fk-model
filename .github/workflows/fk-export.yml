name: fk export

# Read-only: exports every resulted race as a numeric dataset (scripts/export_dataset.py) and
# keeps it on the `datasets` branch (one commit, replaced each run), so models can be tried
# outside Actions. No Form King calls.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'blank = every resulted race (datasets branch); a day YYYY-MM-DD = the races that day, not yet run (upcoming branch)'
        default: ''
      track:
        description: 'with a date: only this track'
        default: ''
      going:
        description: "with a date: price as if the track were this, e.g. 'Heavy 8' (the official rating is stale after rain)"
        default: ''
      state:
        description: 'state(s), comma separated, or ALL for the Australian states (11 Nov 2026); VIC is what the live model reads'
        default: 'VIC'
      branch:
        description: 'blank date only: the branch the dataset goes to (datasets is the one the live work reads; use another for trials)'
        default: 'datasets'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: History cache key
        # The 430 history files were downloaded through the API on every run (gh release download is one API call per
        # asset) and the Actions token has 1,000 calls an hour, so three runs in an hour locked the fourth out
        # (4 Nov 2026). The files are cached between runs and only re-downloaded when the release changes.
        id: hist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          N=$(gh release view history --json assets --jq '[.assets[] | select(.name | endswith(".jsonl.gz"))] | length' 2>/dev/null || echo 0)
          T=$(gh release view history --json assets --jq '[.assets[].updatedAt] | max' 2>/dev/null | tr -dc '0-9' || echo 0)
          echo "key=history-$N-$T" >> "$GITHUB_OUTPUT"
      - name: History from the cache
        uses: actions/cache@v4
        with:
          path: history
          key: ${{ steps.hist.outputs.key }}
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/fetch_history.sh
          # the other states (history-states release, from the archive) only when asked for: Victoria alone never
          # downloads them, so the Victorian export is exactly what it was
          if [ "${{ github.event.inputs.state || 'VIC' }}" != "VIC" ]; then scripts/fetch_history.sh history-states history_states; fi
      - name: Export
        if: github.event.inputs.date == ''
        run: |
          HIST=history
          [ -d history_states ] && HIST=history,history_states
          python scripts/export_dataset.py --state "${{ github.event.inputs.state || 'VIC' }}" --history "$HIST" --out /tmp/ds/model_ds.npz | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Export a day's races
        if: github.event.inputs.date != ''
        run: |
          TRACK_ARG=""
          [ -n "${{ github.event.inputs.track }}" ] && TRACK_ARG="--track '${{ github.event.inputs.track }}'"
          [ -n "${{ github.event.inputs.going }}" ] && TRACK_ARG="$TRACK_ARG --going '${{ github.event.inputs.going }}'"
          eval python scripts/export_dataset.py --date "${{ github.event.inputs.date }}" --state "'${{ github.event.inputs.state || 'VIC' }}'" $TRACK_ARG --out /tmp/up/upcoming.npz | tee -a "$GITHUB_STEP_SUMMARY"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd /tmp/up && git init -q -b upcoming && git config user.name "fk export" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "upcoming ${{ github.event.inputs.date }} ${{ github.event.inputs.track }}" && git push -q -f "$REMOTE" upcoming
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep it on the datasets branch
        if: github.event.inputs.date == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BR="${{ github.event.inputs.branch || 'datasets' }}"
          cd /tmp/ds && git init -q -b "$BR" && git config user.name "fk export" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "dataset ${{ github.event.inputs.state || 'VIC' }} $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "$REMOTE" "$BR"
