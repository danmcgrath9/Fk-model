name: fk archive

# Form King historical archive (Dave's export): download from a Google Drive link, unzip (AES zip, password as an
# input that is masked in the log), and run a script against it. The archive is kept as a private run artifact for
# 7 days so later runs can reuse it without downloading again. Nothing from the archive is committed except the
# script's own output on the `experiments` branch.

on:
  workflow_dispatch:
    inputs:
      drive_id:
        description: 'Google Drive file id of the zip (the file must be shared as anyone-with-the-link)'
        required: true
      password:
        description: 'zip password (masked in the log)'
        required: true
      script:
        description: 'script under scripts/ to run with the unzipped folder as its first argument'
        default: 'archive_inspect.py'
      args:
        description: 'extra arguments'
        default: ''

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - name: Mask the password
        run: echo "::add-mask::${{ github.event.inputs.password }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt gdown
      - name: Download and unzip
        env:
          ZIPPW: ${{ github.event.inputs.password }}
        run: |
          # every line of this step goes into out.md too, so a failure is readable from the experiments branch
          set -o pipefail
          {
            echo "## Download and unzip"; echo '```'
            gdown "https://drive.google.com/uc?id=${{ github.event.inputs.drive_id }}" -O archive.zip 2>&1 | tail -5
            ls -la archive.zip
            sudo apt-get install -y p7zip-full >/dev/null 2>&1
            7z x -y -p"$ZIPPW" -oarchive archive.zip 2>&1 | tail -5
            du -sh archive; find archive -maxdepth 2 | grep -v "/meetings/" | head -40 || true; echo "meetings: $(ls archive/meetings | wc -l)"
            echo '```'
          } 2>&1 | tee out.md
      - name: Run the script
        id: run
        run: |
          set +e
          python "scripts/${{ github.event.inputs.script }}" archive ${{ github.event.inputs.args }} >> out.md 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat out.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the output
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="$(date -u +%Y-%m-%dT%H%MZ)-archive-$(basename "${{ github.event.inputs.script }}" .py)-${{ github.run_id }}.md"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/exp && { git clone -q --depth 1 --branch experiments "$REMOTE" /tmp/exp 2>/dev/null || { mkdir /tmp/exp && cd /tmp/exp && git init -q -b experiments; }; }
          cd /tmp/exp && git config user.name "fk archive" && git config user.email "actions@users.noreply.github.com"
          touch "$GITHUB_WORKSPACE/out.md"; cp "$GITHUB_WORKSPACE/out.md" "$NAME" && git add -A && git commit -q -m "$NAME" && git push -q "$REMOTE" experiments
          echo "kept as $NAME"
          test "${{ steps.run.outputs.status }}" = "0"
