name: fk db to history

# Moves old races' runners out of the database into the "history" release (scripts/db_to_history.py),
# because Supabase's free plan caps the organisation's database and downloads and fk.entries was
# most of both. No Form King calls, no credits.
#
#   step = copy    copy every resulted race older than keep_days into the day files, upload them
#                  and moved.json, then download the release fresh and verify every race is there
#                  byte for byte. Deletes nothing.
#   step = delete  download the release fresh, verify again, then delete those races' fk.entries
#                  rows and VACUUM FULL. Run only after a copy run went green.

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'copy (safe, deletes nothing) or delete (after a green copy run)'
        default: 'copy'
      keep_days:
        description: 'copy only: keep this many recent days in the database'
        default: '21'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Refuse an unknown step
        run: |
          case "${{ github.event.inputs.step }}" in copy|delete) ;; *) echo "step must be copy or delete"; exit 1;; esac

      - name: Fetch the history files
        if: github.event.inputs.step == 'copy'
        run: scripts/fetch_history.sh | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" -eq 0

      - name: Copy old races into the day files
        if: github.event.inputs.step == 'copy'
        run: |
          set -o pipefail
          python scripts/db_to_history.py copy --keep-days "${{ github.event.inputs.keep_days }}" --history history | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the changed days and moved.json
        if: github.event.inputs.step == 'copy'
        run: |
          set -u
          mapfile -t DAYS < <(sed 's|^|history/|' history/changed_days.txt)
          echo "uploading ${#DAYS[@]} day files"
          for i in $(seq 0 25 $(( ${#DAYS[@]} - 1 ))); do
            for attempt in 1 2 3 4 5; do
              timeout 600 gh release upload history "${DAYS[@]:$i:25}" --clobber && break
              echo "upload batch $i attempt $attempt failed"; sleep $((attempt * 15))
              [ "$attempt" -eq 5 ] && exit 1
            done
          done
          gh release upload history history/moved.json --clobber

      - name: Download the release fresh
        run: |
          mkdir -p fresh
          for attempt in 1 2 3 4 5; do
            timeout 900 gh release download history --dir fresh --pattern '*.jsonl.gz' --pattern 'moved.json' --skip-existing && break
            echo "download attempt $attempt failed"; sleep $((attempt * 15))
          done
          echo "fresh download: $(ls fresh/*.jsonl.gz | wc -l) day files, $(du -sh fresh | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify every moved race is on the release
        run: |
          set -o pipefail
          python scripts/db_to_history.py verify --check fresh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete the moved races from the database
        if: github.event.inputs.step == 'delete'
        run: |
          set -o pipefail
          python scripts/db_to_history.py delete --check fresh --yes | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/db_size.py | tee -a "$GITHUB_STEP_SUMMARY"
