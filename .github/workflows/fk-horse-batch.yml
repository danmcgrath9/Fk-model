name: fk horse batch

# Get Horse Form for the last-start race-mates whose next run we cannot see (scripts/horse_batch.py): the
# horses closing the most open form-line slots first. 2 credits a horse; the per-run cap and the balance
# floor trim the batch before the first paid call. Live key only. Run it again for the next horses.

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'horses this run (2 credits each; the per-run cap trims it)'
        default: '290'
      dry_run:
        description: 'yes = list and price the batch, fetch nothing'
        default: 'no'

permissions:
  contents: read

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: History cache key
        id: hist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          N=$(gh release view history --json assets --jq '[.assets[] | select(.name | endswith(".jsonl.gz"))] | length' 2>/dev/null || echo 0)
          T=$(gh release view history --json assets --jq '[.assets[].updatedAt] | max' 2>/dev/null | tr -dc '0-9' || echo 0)
          echo "key=history-$N-$T" >> "$GITHUB_OUTPUT"
      - name: History from the cache
        uses: actions/cache@v4
        with:
          path: history
          key: ${{ steps.hist.outputs.key }}
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Race-mate profiles
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true"; exit 1; }
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "yes" ] && DRY="--dry-run"
          python scripts/horse_batch.py --key live --yes --max "${{ github.event.inputs.max }}" --history history $DRY | tee -a "$GITHUB_STEP_SUMMARY"
