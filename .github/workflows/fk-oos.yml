name: fk out-of-sample

# The LIVE betting rule tested on newly settled races, every day and every week (founder, 19 Oct 2026: "Have we been
# back testing with results"). research/form_gbm/t_weekly_oos.py: each new day (and each new Monday-to-Sunday week)
# priced by v10 stage-1 trees trained only on races before it, the BetMatic orders as they would fire at the open with
# the firm/drift stakes, settled at the open (16c deduction) and at BSP. The ledgers and tables are committed to
# research/form_gbm/oos/ (daily.csv + DAILY.md, weekly.csv + WEEKLY.md, one bets_*.csv per period). No Form King calls.

on:
  schedule:
    - cron: '0 23 * * *'    # 10:00am Melbourne (daylight saving), after the 7-8am results job: yesterday's races
  workflow_dispatch:
    inputs:
      period:
        description: 'day, week or both'
        default: 'both'
      from:
        description: 'first day / Monday to test (only periods not already in the ledger run)'
        default: '2026-10-12'

concurrency:
  group: fk-oos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          pip install -r requirements.txt
          pip install lightgbm
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Export the dataset (every resulted race with a BSP)
        run: |
          mkdir -p research/form_gbm/ds
          python scripts/export_dataset.py --out research/form_gbm/ds/model_ds.npz | tail -5
      - name: Test the live rule on the new days and weeks
        working-directory: research/form_gbm
        env:
          PERIOD: ${{ github.event.inputs.period || 'both' }}
          FROM: ${{ github.event.inputs.from || '2026-10-12' }}
        run: |
          set -o pipefail
          # weekly runs only when a whole new Monday-Sunday week has settled; the script skips periods already done
          if [ "$PERIOD" = "day" ] || [ "$PERIOD" = "both" ]; then python t_weekly_oos.py --period day --from "$FROM" | grep -v " seed " | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ "$PERIOD" = "week" ] || [ "$PERIOD" = "both" ]; then python t_weekly_oos.py --period week --from "$FROM" | grep -v " seed " | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the ledgers
        run: |
          git config user.name "fk-oos"; git config user.email "actions@users.noreply.github.com"
          git add research/form_gbm/oos
          git diff --cached --quiet || { git commit -m "Out-of-sample test of the live rule: $(date -u +%Y-%m-%d)"; for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i*3)); done; }
