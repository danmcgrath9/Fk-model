name: fk archive replay

# Rebuild model day files from Dave's point-in-time archive exactly as the live pipeline would have built them before
# the jump: his local proxy stands in for the Form King API, our daily_pull writes to a throwaway local Postgres, and
# export_dataset writes one npz per day. The same days are exported from OUR database too, so the two copies can be
# priced side by side. Also runs archive_quality.py. Outputs go to the `archive-replay` branch. No Form King credits.

on:
  workflow_dispatch:
    inputs:
      drive_id:
        description: 'Google Drive file id of the zip (shared as anyone-with-the-link)'
        required: true
      password:
        description: 'zip password (masked in the log)'
        required: true
      state:
        default: 'VIC'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      LOCAL_DB: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - name: Mask the password
        run: echo "::add-mask::${{ github.event.inputs.password }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt gdown
      - name: Download, unzip, quality check, replay, export
        env:
          ZIPPW: ${{ github.event.inputs.password }}
          OURS_DB: ${{ secrets.FK_DATABASE_URL }}
          ST: ${{ github.event.inputs.state }}
        run: |
          mkdir -p out
          {
          echo "## Replay log"; echo '```'
          gdown "https://drive.google.com/uc?id=${{ github.event.inputs.drive_id }}" -O archive.zip 2>&1 | tail -1
          sudo apt-get install -y p7zip-full postgresql-client >/dev/null 2>&1
          7z x -y -p"$ZIPPW" -oarchive archive.zip 2>&1 | grep -E "Everything|ERROR" || true
          for f in sql/*.sql; do psql "$LOCAL_DB" -q -v ON_ERROR_STOP=0 -f "$f" >/dev/null 2>&1 || echo "schema $f had errors"; done
          (cd archive && nohup python fk_historical_proxy.py --port 8080 --dir . > ../proxy.log 2>&1 &)
          sleep 4; curl -s -o /dev/null -w "proxy: %{http_code}\n" http://127.0.0.1:8080/b2c/meetings/date/200826
          DAYS=$(python -c "import json;d=json.load(open('archive/index.json'));print(' '.join(sorted({x['date'] for x in d['days'] for m in x['meetings'] if m.get('state')=='$ST'})))")
          echo "days: $DAYS"
          for dd in $DAYS; do
            iso="20${dd:4:2}-${dd:2:2}-${dd:0:2}"
            echo "--- $iso pull from the archive proxy"
            DATABASE_URL="$LOCAL_DB" FK_BASE_URL=http://127.0.0.1:8080 python scripts/daily_pull.py --key test --yes --date "$iso" --state "$ST" --all-statuses --no-profiles 2>&1 | tail -4
            DATABASE_URL="$LOCAL_DB" python scripts/export_dataset.py --date "$iso" --state "$ST" --out "out/arch_$iso.npz" 2>&1 | tail -2
            DATABASE_URL="$OURS_DB" python scripts/export_dataset.py --date "$iso" --state "$ST" --out "out/ours_$iso.npz" 2>&1 | tail -2
          done
          ls -la out
          echo '```'
          } 2>&1 | tee replay.md
          python scripts/archive_quality.py archive "$ST" > quality_state.md 2>&1 || true
          python scripts/archive_quality.py archive > quality_all.md 2>&1 || true
          cat quality_state.md quality_all.md >> replay.md
          tail -20 proxy.log >> replay.md || true
      - name: Keep the outputs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/rp && mkdir /tmp/rp && cd /tmp/rp && git init -q -b archive-replay
          git config user.name "fk archive" && git config user.email "actions@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE"/replay.md . 2>/dev/null || echo "no log" > replay.md
          cp "$GITHUB_WORKSPACE"/out/*.npz . 2>/dev/null || true
          git add -A && git commit -q -m "archive replay ${{ github.run_id }}" && git push -q -f "$REMOTE" archive-replay
