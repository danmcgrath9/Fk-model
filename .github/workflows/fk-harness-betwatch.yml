name: fk harness betwatch

# Betwatch price history for Australian harness (13 Nov 2026): every bookmaker's price changes with timestamps back to
# November 2022, TAB included, plus driver, trainer and the Betfair market and selection ids that join onto Betfair's
# files. Same code as the greyhound pull (greyhound/betwatch.py, --type Harness --locations Australia). The data is
# for our own models only, never shared (Betwatch's terms): logs print counts only, and the pull lives in this
# repository's Actions cache, never in a commit or a release.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (counts only, sample days), pull (month files into the Actions cache, resumable), or model (research/harness/bw_model.py over the cache and Betfair files; scores only)'
        default: 'probe'
      type:
        description: 'Harness, Thoroughbred or Greyhound'
        default: 'Harness'
      days:
        description: 'mode=probe: days to sample, comma separated YYYY-MM-DD (blank = five from Nov 2022 to now)'
        default: ''
      from:
        description: 'mode=pull: first month YYYY-MM'
        default: '2022-11'
      to:
        description: 'mode=pull: last month YYYY-MM (blank = this month)'
        default: ''
      script:
        description: 'mode=model: the script to run (research/harness/bw_model.py = Test 8, bw_form.py = Test 9)'
        default: 'research/harness/bw_model.py'
      pub:
        description: 'mode=live: base64 of the PEM public key the picks are sealed to (the private key never leaves the reader)'
        default: ''
      day:
        description: 'mode=live: the race day YYYY-MM-DD (blank = today in Sydney)'
        default: ''
      max_minutes:
        description: 'mode=pull: minutes of pulling before the cache is saved (the rest resumes next run)'
        default: '300'

concurrency:
  group: fk-betwatch-${{ github.event.inputs.type }}-${{ github.event.inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  betwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      BETWATCH_API_KEY: ${{ secrets.BETWATCH_API_KEY }}
      TYPE: ${{ github.event.inputs.type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31'
      - if: github.event.inputs.mode == 'model' || github.event.inputs.mode == 'live'
        run: pip install pandas pyarrow lightgbm scikit-learn

      - name: Probe (counts only)
        if: github.event.inputs.mode == 'probe'
        run: |
          D="${{ github.event.inputs.days }}"
          python -m greyhound.betwatch probe --type "$TYPE" --locations Australia ${D:+--days "$D"} | tee -a "$GITHUB_STEP_SUMMARY"

      # v2 (18 Nov 2026): race class and track condition kept; v1 caches dropped them, so they are not restored.
      - name: Restore the pulled months (Actions cache, this repository only)
        if: github.event.inputs.mode == 'pull' || github.event.inputs.mode == 'model' || github.event.inputs.mode == 'live'
        uses: actions/cache/restore@v4
        with:
          path: betwatch-cache/${{ github.event.inputs.type }}
          key: betwatch-AU-v2-${{ github.event.inputs.type }}-${{ github.run_id }}
          restore-keys: betwatch-AU-v2-${{ github.event.inputs.type }}-

      - name: Pull (counts only)
        if: github.event.inputs.mode == 'pull'
        run: |
          T="${{ github.event.inputs.to }}"
          python -m greyhound.betwatch pull --type "$TYPE" --locations Australia --from "${{ github.event.inputs.from }}" ${T:+--to "$T"} \
            --dir "betwatch-cache/$TYPE" --max-minutes "${{ github.event.inputs.max_minutes }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore Racing Queensland's sectionals (model; Actions cache, personal use)
        if: github.event.inputs.mode == 'model'
        uses: actions/cache/restore@v4
        with:
          path: rq-cache
          key: rq-sectionals-none
          restore-keys: rq-sectionals-

      - name: Download Betfair's free harness files (model)
        if: github.event.inputs.mode == 'model'
        run: |
          mkdir -p bf
          for f in ANZ_Harness_2020.zip ANZ_Harness_2021.zip ANZ_Harness_2022.zip ANZ_Harness_2023.zip ANZ_Harness_2024.zip \
                   ANZ_Harness_2025.zip $(for m in 01 02 03 04 05 06 07 08 09 10 11; do echo ANZ_Harness_2026_$m.csv; done); do
            curl -fsSL --retry 3 -o "bf/$f" "https://betfair-datascientists.github.io/data/assets/$f" \
              && echo "$f $(stat -c %s "bf/$f") bytes" || { echo "not published: $f"; rm -f "bf/$f"; }
          done

      - name: Model (scores only; no Betwatch row is printed or uploaded)
        if: github.event.inputs.mode == 'model'
        run: |
          set -o pipefail
          python "${{ github.event.inputs.script }}" bf "betwatch-cache/$TYPE" "Australian harness" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Today's paper picks (counts and scores in the clear; the picks sealed)
        if: github.event.inputs.mode == 'live'
        env:
          PUB: ${{ github.event.inputs.pub }}
          DAY: ${{ github.event.inputs.day }}
        run: |
          set -o pipefail
          python research/harness/bw_live.py "betwatch-cache/$TYPE" --pub "$PUB" ${DAY:+--day "$DAY"}

      - name: Save the pulled months (Actions cache)
        if: always() && github.event.inputs.mode == 'pull'
        uses: actions/cache/save@v4
        with:
          path: betwatch-cache/${{ github.event.inputs.type }}
          key: betwatch-AU-v2-${{ github.event.inputs.type }}-${{ github.run_id }}
