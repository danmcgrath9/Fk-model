name: fk backtest

# Pulls past Victorian days (race forms only, no horse profiles) so every runner carries
# its result and Betfair SP, then fits the rated price to BSP and commits the model
# (config/rated_price.json) and the report (docs/BACKTEST.md) to main. The next report
# build prices with it. Live key only; the per-day cap and the balance floor still apply,
# and max_credits stops the loop for the whole run.

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'first day YYYY-MM-DD'
        required: true
      to:
        description: 'last day YYYY-MM-DD'
        required: true
      max_credits:
        description: 'stop pulling once this many credits are spent in this run'
        default: '500'
      fit_only:
        description: 'yes = no pulling, just fit on what is stored'
        default: 'no'
      track:
        description: 'only these tracks, comma separated (e.g. Flemington,Caulfield,Moonee Valley,Sandown); blank = all'
        default: ''
      days_of_week:
        description: 'only these weekdays, 1=Monday .. 7=Sunday, comma separated (e.g. 6 for Saturdays); blank = every day'
        default: ''

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Pull past days
        if: github.event.inputs.fit_only != 'yes'
        env:
          FK_API_KEY: ${{ secrets.FK_API_KEY }}
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true; a back-test needs the live key"; exit 1; }
          START=$(python scripts/ledger.py balance)
          d="${{ github.event.inputs.from }}"
          while [ "$d" != "$(date -I -d "${{ github.event.inputs.to }} + 1 day")" ]; do
            NOW=$(python scripts/ledger.py balance)
            SPENT=$((START - NOW))
            if [ "$SPENT" -ge "${{ github.event.inputs.max_credits }}" ]; then
              echo "stopping before $d: $SPENT credits spent this run (max ${{ github.event.inputs.max_credits }})"; break
            fi
            DOW=$(date -d "$d" +%u)
            if [ -n "${{ github.event.inputs.days_of_week }}" ] && ! echo ",${{ github.event.inputs.days_of_week }}," | tr -d ' ' | grep -q ",$DOW,"; then
              d=$(date -I -d "$d + 1 day"); continue
            fi
            echo "=== $d (spent so far $SPENT) ==="
            TRACK_ARG=""
            [ -n "${{ github.event.inputs.track }}" ] && TRACK_ARG="--track"
            python scripts/daily_pull.py --key live --yes --no-profiles --date "$d" $TRACK_ARG ${{ github.event.inputs.track && format('"{0}"', github.event.inputs.track) || '' }} || echo "day $d failed; continuing"
            d=$(date -I -d "$d + 1 day")
          done
          echo "run spent $((START - $(python scripts/ledger.py balance))) credits" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fit to Betfair SP
        run: |
          # Without pipefail a failed fit piped into tee reads as success and the job
          # says "model unchanged" over a traceback.
          set -o pipefail
          python scripts/backtest.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the model
        run: |
          git config user.name "fk backtest" && git config user.email "actions@users.noreply.github.com"
          git add config/rated_price.json docs/BACKTEST.md
          git diff --cached --quiet && { echo "model unchanged"; exit 0; }
          git commit -q -m "Back-test: rated price refitted to Betfair SP"
          # main may have moved during a long pull; replay the model commit on top of it
          git pull -q --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
