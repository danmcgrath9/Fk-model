name: fk backtest

# Pulls past Victorian days (race forms only, no horse profiles) so every runner carries
# its result and Betfair SP, then fits the rated price to BSP and commits the model
# (config/rated_price.json) and the report (docs/BACKTEST.md) to main. The next report
# build prices with it. Live key only; the per-day cap and the balance floor still apply,
# and max_credits stops the loop for the whole run.

on:
  schedule:
    - cron: '30 22 * * 1'   # Monday 22:30 UTC = Tuesday 8:30am Melbourne, after the weekend's results: refit on everything stored, no credits
  workflow_dispatch:
    inputs:
      from:
        description: 'first day YYYY-MM-DD'
        required: true
      to:
        description: 'last day YYYY-MM-DD'
        required: true
      max_credits:
        description: 'stop pulling once this many credits are spent in this run'
        default: '500'
      fit_only:
        description: 'yes = no pulling, just fit on what is stored'
        default: 'no'
      track:
        description: 'only these tracks, comma separated (e.g. Flemington,Caulfield,Moonee Valley,Sandown); blank = all'
        default: ''
      days_of_week:
        description: 'only these weekdays, 1=Monday .. 7=Sunday, comma separated (e.g. 6 for Saturdays); blank = every day'
        default: ''
      pull_only:
        description: 'yes = pull and stop, no fit (a long backfill and its fit are too much for one job)'
        default: 'no'
      disk_stop_mb:
        description: 'database store only: stop pulling once the database reaches this many MB (the disk ran out just under 1 GB)'
        default: '850'
      store:
        description: 'files = compressed day files on the history release (no database space); database = the old way'
        default: 'files'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Fetch the history files
        # Past days kept as compressed files on the repo's "history" release (fk/history.py),
        # because the database is nearly full. The fit reads them beside the database, and
        # the pull checks them so no race is paid for twice.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view history >/dev/null 2>&1 || gh release create history --target main --latest=false \
            --title "Race history" --notes "Past days for the back-test, one compressed file per day (fk/history.py). Written by the fk backtest workflow; do not delete."
          scripts/fetch_history.sh | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Pull past days
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.fit_only != 'yes'
        env:
          FK_API_KEY: ${{ secrets.FK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true; a back-test needs the live key"; exit 1; }
          START=$(python scripts/ledger.py balance)
          STORE="${{ github.event.inputs.store || 'files' }}"
          T0=$(date +%s)
          # NEWEST FIRST: when the credit cap or the disk guard stops the run, what was kept
          # is the most recent racing, which is the most like tomorrow's.
          d="${{ github.event.inputs.to }}"
          while [ "$d" != "$(date -I -d "${{ github.event.inputs.from }} - 1 day")" ]; do
            NOW=$(python scripts/ledger.py balance)
            SPENT=$((START - NOW))
            if [ "$SPENT" -ge "${{ github.event.inputs.max_credits }}" ]; then
              echo "stopping before $d: $SPENT credits spent this run (max ${{ github.event.inputs.max_credits }})"; break
            fi
            # stop with room to spare before the 180-minute limit kills a day half paid for
            if [ $(( $(date +%s) - T0 )) -ge 9600 ]; then
              echo "stopping before $d: 160 minutes used; $SPENT credits spent"; break
            fi
            MB=$(python scripts/db_size.py --mb)
            if [ "$STORE" = "database" ] && [ "$MB" -ge "${{ github.event.inputs.disk_stop_mb || '850' }}" ]; then
              echo "stopping before $d: database at $MB MB (guard ${{ github.event.inputs.disk_stop_mb || '850' }} MB); $SPENT credits spent"; break
            fi
            DOW=$(date -d "$d" +%u)
            if [ -n "${{ github.event.inputs.days_of_week }}" ] && ! echo ",${{ github.event.inputs.days_of_week }}," | tr -d ' ' | grep -q ",$DOW,"; then
              d=$(date -I -d "$d - 1 day"); continue
            fi
            echo "=== $d (spent so far $SPENT, database $MB MB) ==="
            TRACK_ARG=""
            [ -n "${{ github.event.inputs.track }}" ] && TRACK_ARG="--track"
            if [ "$STORE" = "database" ]; then
              python scripts/daily_pull.py --key live --yes --no-profiles --skip-held --no-past-events --date "$d" $TRACK_ARG ${{ github.event.inputs.track && format('"{0}"', github.event.inputs.track) || '' }} || echo "day $d failed; continuing"
            else
              BEFORE=$(md5sum "history/$d.jsonl.gz" 2>/dev/null | cut -d' ' -f1)
              python scripts/history_pull.py --key live --yes --out history --date "$d" $TRACK_ARG ${{ github.event.inputs.track && format('"{0}"', github.event.inputs.track) || '' }} || echo "day $d failed; continuing"
              # Upload the day straight away: a paid-for day that only lives on this runner is
              # lost when the job ends. If it will not upload, stop spending.
              AFTER=$(md5sum "history/$d.jsonl.gz" 2>/dev/null | cut -d' ' -f1)
              if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
                ok=no
                for i in 1 2 3; do
                  gh release upload history "history/$d.jsonl.gz" --clobber && { ok=yes; break; }
                  sleep $((i * 5))
                done
                [ "$ok" = yes ] || { echo "could not upload history/$d.jsonl.gz; stopping so no more credits are spent"; exit 1; }
              fi
            fi
            d=$(date -I -d "$d - 1 day")
          done
          echo "run spent $((START - $(python scripts/ledger.py balance))) credits" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "history files now: $(ls history | wc -l), $(du -sh history | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fit to Betfair SP
        if: github.event.inputs.pull_only != 'yes'
        run: |
          # Without pipefail a failed fit piped into tee reads as success and the job
          # says "model unchanged" over a traceback.
          set -o pipefail
          python scripts/backtest.py | tee -a "$GITHUB_STEP_SUMMARY"
          # the form-only price (no market input) refits on the same racing
          python scripts/fit_form_only.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the model
        if: github.event.inputs.pull_only != 'yes'
        run: |
          git config user.name "fk backtest" && git config user.email "actions@users.noreply.github.com"
          git add config/rated_price.json docs/BACKTEST.md config/form_price.json
          git diff --cached --quiet && { echo "model unchanged"; exit 0; }
          git commit -q -m "Back-test: rated price refitted to Betfair SP"
          # main may have moved during a long pull; replay the model commit on top of it
          git pull -q --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
