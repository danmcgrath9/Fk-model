name: fk price run

# One run for the morning's pricing inputs (12 Nov 2026, founder: "the run takes an hour? Thats way to fkn long").
# It pulls the dates (races not already stored only, the pull's own rule), then reads everything the pricer needs for
# every new Victorian meeting on them (scratchings, entry numbers, race times, flucs, rain, meeting status) and exports
# each date's races, and puts all of it on the `pricing` branch for the session to fetch in one go. The form reports
# are built last, after the pricing files are pushed, so they never hold the pricing up.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'meeting dates YYYY-MM-DD, comma separated (blank = the next three days, Melbourne)'
        default: ''
      pull:
        description: 'yes = pull the dates first (only races not already stored are paid for); no = read only'
        default: 'yes'
      force:
        description: 'yes = re-pull races already stored (riders declared since): 2 credits a race again'
        default: 'no'
      track:
        description: 'with force: only this track'
        default: ''
      all:
        description: 'yes = read every meeting on the dates, not only those with no order sheet yet'
        default: 'no'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: History cache key
        id: hist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          N=$(gh release view history --json assets --jq '[.assets[] | select(.name | endswith(".jsonl.gz"))] | length' 2>/dev/null || echo 0)
          T=$(gh release view history --json assets --jq '[.assets[].updatedAt] | max' 2>/dev/null | tr -dc '0-9' || echo 0)
          echo "key=history-$N-$T" >> "$GITHUB_OUTPUT"
      - name: History from the cache
        uses: actions/cache@v4
        with:
          path: history
          key: ${{ steps.hist.outputs.key }}
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Dates
        id: d
        run: |
          D="${{ github.event.inputs.dates }}"
          [ -n "$D" ] || D="$(for n in 1 2 3; do TZ=Australia/Melbourne date -d "+$n days" +%F; done | paste -sd,)"
          echo "dates=$D" >> "$GITHUB_OUTPUT"; echo "dates $D" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pull
        if: github.event.inputs.pull != 'no'
        env:
          FK_API_KEY: ${{ secrets.FK_API_KEY }}
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true"; exit 1; }
          EXTRA=""
          [ "${{ github.event.inputs.force }}" = "yes" ] && EXTRA="--force"
          for D in $(echo "${{ steps.d.outputs.dates }}" | tr ',' ' '); do
            if [ -n "${{ github.event.inputs.track }}" ]; then
              python scripts/daily_pull.py --key live --yes --date "$D" --track "${{ github.event.inputs.track }}" $EXTRA | tee -a "$GITHUB_STEP_SUMMARY"
            else
              python scripts/daily_pull.py --key live --yes --date "$D" $EXTRA | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Pricing inputs
        run: |
          ALL=""; [ "${{ github.event.inputs.all }}" = "yes" ] && ALL="--all"
          python scripts/price_inputs.py /tmp/pricing "${{ steps.d.outputs.dates }}" $ALL | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push the pricing files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "${{ github.run_id }}" > /tmp/pricing/RUN_ID
          cd /tmp/pricing && git init -q -b pricing && git config user.name "fk price run" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "pricing inputs ${{ steps.d.outputs.dates }} run ${{ github.run_id }}" && git push -q -f "$REMOTE" pricing
      - name: Form reports
        if: always()
        run: for D in $(echo "${{ steps.d.outputs.dates }}" | tr ',' ' '); do python scripts/build_report.py --no-open --date "$D" || true; done
      - name: Push reports to the reports branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls reports/*.html >/dev/null 2>&1 || { echo "no reports to push"; exit 0; }
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/reports-branch
          if git clone -q --depth 1 --branch reports "$REMOTE" /tmp/reports-branch 2>/dev/null; then
            cd /tmp/reports-branch
          else
            mkdir /tmp/reports-branch && cd /tmp/reports-branch && git init -q -b reports
          fi
          git config user.name "fk price run" && git config user.email "actions@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE"/reports/*.html .
          git add -A && git commit -q -m "Reports built $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new to push"
          for i in 1 2 3; do git pull -q --rebase "$REMOTE" reports && git push -q "$REMOTE" reports && break; sleep $((i*3)); done
