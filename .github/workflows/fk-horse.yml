name: fk horse

# One horse from Form King: its latest runs and ratings printed in the run summary, and
# stored. 2 credits plus 0.5 per benchmarked run beyond five. Live key only.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'horse name as Form King spells it (must be one we have held before)'
        default: ''
      horse_id:
        description: 'or the Form King horse id (from its URL), which needs no prior record'
        default: ''
      benchmarks:
        description: 'benchmarked runs to fetch (5 is free within the 2 credits)'
        default: '5'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

jobs:
  horse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Horse form
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true"; exit 1; }
          ARG=""
          [ -n "${{ github.event.inputs.horse_id }}" ] && ARG="--horse-id ${{ github.event.inputs.horse_id }}"
          [ -z "$ARG" ] && ARG="--name \"${{ github.event.inputs.name }}\""
          eval python scripts/horse_check.py --key live --yes --benchmarks ${{ github.event.inputs.benchmarks }} $ARG | tee -a "$GITHUB_STEP_SUMMARY"
