name: fk live price replay

# Read-only: replays every betting method at the REAL 9am prices stored for the races the
# pipeline has priced, with a model fitted only on earlier races. No Form King calls.

on:
  workflow_dispatch:
    inputs:
      window:
        description: 'morning = the 9am price; evening = the price at the evening-before pull, the first we see'
        default: 'morning'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p history
          N=$(gh release view history --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$N" -gt 0 ]; then gh release download history --dir history --pattern '*.jsonl.gz' --clobber; fi
          echo "history files: $(ls history | wc -l)"
      - name: Replay at the real morning prices
        run: |
          set -o pipefail
          python scripts/live_price_replay.py --window "${{ github.event.inputs.window || 'morning' }}" | tee -a "$GITHUB_STEP_SUMMARY"
