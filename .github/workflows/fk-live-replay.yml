name: fk live price replay

# Read-only: replays every betting method at the REAL 9am prices stored for the races the
# pipeline has priced, with a model fitted only on earlier races. No Form King calls.

on:
  schedule:
    - cron: '30 22 * * *'   # 8:30am Melbourne standard time, after the 7am results job: every day's real prices join the test
  workflow_dispatch:
    inputs:
      window:
        description: 'both, morning (the 9am price) or evening (the price at the evening-before pull, the first we see)'
        default: 'both'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/fetch_history.sh
      - name: Replay at the real morning prices
        run: |
          set -o pipefail
          W="${{ github.event.inputs.window || 'both' }}"
          if [ "$W" != "evening" ]; then python scripts/live_price_replay.py --window morning | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ "$W" != "morning" ]; then
            echo; echo "## Evening-before prices"; python scripts/live_price_replay.py --window evening | tee -a "$GITHUB_STEP_SUMMARY"
          fi
