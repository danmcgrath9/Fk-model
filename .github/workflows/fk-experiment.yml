name: fk experiment

# Read-only: runs one of the quick out-of-sample trial scripts over the stored racing
# (database plus the history files). No Form King calls, nothing committed.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'script under scripts/ to run (e.g. feature_trial.py)'
        default: 'feature_trial.py'
      args:
        description: 'extra arguments'
        default: ''

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Run the trial
        run: |
          set -o pipefail
          python "scripts/${{ github.event.inputs.script }}" ${{ github.event.inputs.args }} | tee -a "$GITHUB_STEP_SUMMARY"
