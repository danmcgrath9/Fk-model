name: fk experiment

# Read-only: runs one of the quick out-of-sample trial scripts over the stored racing
# (database plus the history files). No Form King calls, nothing committed.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'script under scripts/ to run (e.g. feature_trial.py)'
        default: 'feature_trial.py'
      args:
        description: 'extra arguments'
        default: ''

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Run the trial
        id: trial
        run: |
          # The output is kept on the "experiments" branch as well as the step summary, because
          # a job log is not always readable from outside GitHub.
          set +e
          python "scripts/${{ github.event.inputs.script }}" ${{ github.event.inputs.args }} > out.md 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat out.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the output
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="$(date -u +%Y-%m-%dT%H%MZ)-$(basename "${{ github.event.inputs.script }}" .py)-${{ github.run_id }}.md"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/exp && { git clone -q --depth 1 --branch experiments "$REMOTE" /tmp/exp 2>/dev/null || { mkdir /tmp/exp && cd /tmp/exp && git init -q -b experiments; }; }
          cd /tmp/exp && git config user.name "fk experiment" && git config user.email "actions@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/out.md" "$NAME" && git add -A && git commit -q -m "$NAME" && git push -q "$REMOTE" experiments
          echo "kept as $NAME"
          test "${{ steps.trial.outputs.status }}" = "0"
