name: fk results

# Next morning: results and final odds for yesterday's Victorian races, then a fresh price
# snapshot for TODAY's meetings (one Meeting Summary each) and the reports rebuilt with the
# overnight market. Same guards as the pull.

on:
  schedule:
    - cron: '0 21 * * *'   # 07:00 Melbourne in standard time, 08:00 in daylight saving
  workflow_dispatch:
    inputs:
      key:
        description: 'test or live (live also needs FK_LIVE=true)'
        default: 'test'
      date:
        description: 'race date YYYY-MM-DD (default: yesterday, Melbourne)'
        default: ''

concurrency:
  group: fk-results
  cancel-in-progress: false

permissions:
  contents: write   # to push the rebuilt reports to the `reports` branch

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Decide which key
        id: key
        run: |
          WANT="${{ github.event.inputs.key || 'live' }}"
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$WANT" = "live" ] && [ "$LIVE_FLAG" = "true" ]; then echo "key=live" >> "$GITHUB_OUTPUT"; else echo "key=test" >> "$GITHUB_OUTPUT"; fi
      - name: Fetch results
        env:
          FK_API_KEY: ${{ steps.key.outputs.key == 'live' && secrets.FK_API_KEY || 'FK-TEST-API-KEY' }}
        run: |
          DATE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          python scripts/fetch_results.py --key ${{ steps.key.outputs.key }} --yes $DATE_ARG
      - name: Morning odds for today
        if: always()
        env:
          FK_API_KEY: ${{ steps.key.outputs.key == 'live' && secrets.FK_API_KEY || 'FK-TEST-API-KEY' }}
        run: python scripts/morning_odds.py --key ${{ steps.key.outputs.key }} --yes

      - name: Rebuild today's reports
        if: always()
        run: python scripts/build_report.py --no-open --date "$(TZ=Australia/Melbourne date +%Y-%m-%d)"

      - name: Ledger
        if: always()
        run: |
          echo '## Credits' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/ledger.py show --limit 30 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fk-reports-morning
          path: reports/*.html
          if-no-files-found: ignore

      - name: Push reports to the reports branch
        if: always()
        run: |
          ls reports/*.html >/dev/null 2>&1 || { echo "no reports to push"; exit 0; }
          rm -rf /tmp/reports-branch && mkdir /tmp/reports-branch && cp reports/*.html /tmp/reports-branch/
          cd /tmp/reports-branch
          git init -q -b reports
          git config user.name "fk morning" && git config user.email "actions@users.noreply.github.com"
          printf '# Reports\n\nLatest form reports, replaced on every run.\n' > README.md
          git add -A && git commit -q -m "Reports rebuilt with morning odds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
