name: fk db weekly

# The weekly clear-out (founder, 19 Nov 2026: "Maybe we add this to a weekly night run to clear up space?"), after
# the disk filled on 18 Nov and the project went read-only. Sunday night, in the pull queue so nothing writes meanwhile:
#   1. every resulted race older than keep_days moves out to the history files (scripts/db_to_history.py): copied,
#      uploaded, downloaded fresh and verified byte for byte, and only then deleted from fk.entries. A plain VACUUM
#      makes the space reusable by the next weeks' runners (full = yes also gives it back to the disk, when there
#      is room to rewrite the table).
#   2. the size is reported, and the run FAILS when the database is over warn_mb, so GitHub emails the warning.
# The move only runs while the history release is a DRAFT (private): the Form King licence is personal and the
# repository is public, so racing data is never uploaded to a published release.
#   step = check   read-only: proves gh can read a draft release by tag (scripts/gh_draft_check.py)
#   step = private turns the history release (Form King race data, licensed to the founder alone) into a draft, so only
#                  people with push access can see or download it; every workflow reads it through gh, which finds a draft
#                  by its tag (proved by step=check on 19 Nov 2026). Founder, 20 Nov: "Do whatever is best".

on:
  schedule:
    - cron: '0 12 * * 0'   # Sunday 23:00 Melbourne in daylight saving (22:00 in standard time)
  workflow_dispatch:
    inputs:
      step:
        description: 'weekly (the clear-out), check (read-only draft check) or private (history release to draft)'
        default: 'weekly'
      keep_days:
        description: 'keep this many recent days of runners in the database'
        default: '21'
      full:
        description: 'yes = VACUUM FULL after the delete (needs free disk the size of what stays)'
        default: 'no'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: write

env:
  WARN_MB: '1350'

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      STEP: ${{ github.event.inputs.step || 'weekly' }}
      KEEP_DAYS: ${{ github.event.inputs.keep_days || '21' }}
      FULL: ${{ github.event.inputs.full || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Draft check
        if: env.STEP == 'check'
        run: python scripts/gh_draft_check.py fk-db-backup | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Make the history release private (a draft)
        if: env.STEP == 'private'
        run: |
          set -euo pipefail
          ID=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="history") | .id' | head -1)
          [ -n "$ID" ] || { echo "no history release"; exit 1; }
          gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F draft=true --jq '"history release \(.id): draft=\(.draft), \(.assets | length) assets"' | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/gh_draft_check.py history moved.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Size before
        if: env.STEP == 'weekly'
        run: python scripts/db_size.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Is the history release private?
        if: env.STEP == 'weekly'
        id: priv
        run: |
          D=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="history") | .draft' | head -1)
          if [ "$D" = "true" ]; then echo "ok=yes" >> "$GITHUB_OUTPUT"
          else echo "ok=no" >> "$GITHUB_OUTPUT"; echo "SKIPPED the move: the history release is published (public), and racing data is never uploaded to a public release. Make it a draft first." | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Fetch the history files
        if: env.STEP == 'weekly' && steps.priv.outputs.ok == 'yes'
        run: scripts/fetch_history.sh | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" -eq 0

      - name: Copy old races into the day files
        if: env.STEP == 'weekly' && steps.priv.outputs.ok == 'yes'
        run: |
          set -o pipefail
          python scripts/db_to_history.py copy --keep-days "$KEEP_DAYS" --history history | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the changed days and moved.json
        if: env.STEP == 'weekly' && steps.priv.outputs.ok == 'yes'
        run: |
          set -u
          mapfile -t DAYS < <(sed 's|^|history/|' history/changed_days.txt)
          echo "uploading ${#DAYS[@]} day files"
          for i in $(seq 0 25 $(( ${#DAYS[@]} - 1 ))); do
            for attempt in 1 2 3 4 5; do
              timeout 600 gh release upload history "${DAYS[@]:$i:25}" --clobber && break
              echo "upload batch $i attempt $attempt failed"; sleep $((attempt * 15))
              [ "$attempt" -eq 5 ] && exit 1
            done
          done
          gh release upload history history/moved.json --clobber

      - name: Download the release fresh
        if: env.STEP == 'weekly' && steps.priv.outputs.ok == 'yes'
        run: |
          mkdir -p fresh
          for attempt in 1 2 3 4 5; do
            timeout 900 gh release download history --dir fresh --pattern '*.jsonl.gz' --pattern 'moved.json' --skip-existing && break
            echo "download attempt $attempt failed"; sleep $((attempt * 15))
          done
          echo "fresh download: $(ls fresh/*.jsonl.gz | wc -l) day files, $(du -sh fresh | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify, then delete the moved races from the database
        if: env.STEP == 'weekly' && steps.priv.outputs.ok == 'yes'
        run: |
          set -o pipefail
          V=plain; [ "$FULL" = "yes" ] && V=full
          python scripts/db_to_history.py delete --check fresh --yes --vacuum "$V" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Size after, and the warning line
        if: env.STEP == 'weekly'
        run: |
          python scripts/db_size.py | tee -a "$GITHUB_STEP_SUMMARY"
          MB=$(python scripts/db_size.py --mb)
          echo "database ${MB} MB, warning line ${WARN_MB} MB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -gt "$WARN_MB" ]; then
            echo "::error::The fk database is ${MB} MB, over the ${WARN_MB} MB warning line: the disk locks read-only when it fills"
            exit 1
          fi
