name: fk nominations

# Prices a nomination list (a file under data/nominations/) on the form-only price, off each
# horse's latest stored Form King entry. refresh=yes first pays for a fresh Get Horse Form
# (2 credits a horse) on every horse whose stored entry has already been run, so a winner
# since then is priced as a winner. Live key only for the refresh; the credit cap and the
# balance floor apply.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'nomination list, e.g. data/nominations/ballarat-2026-09-30-r1.txt'
        required: true
      distance:
        description: 'race distance in metres'
        required: true
      date:
        description: 'race date YYYY-MM-DD'
        required: true
      track:
        description: 'track, for the track record'
        default: ''
      refresh:
        description: 'yes = pay for fresh horse form on horses whose stored entry has run'
        default: 'no'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '100' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Price the nominations
        env:
          IN_FILE: ${{ github.event.inputs.file }}
          IN_DISTANCE: ${{ github.event.inputs.distance }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_TRACK: ${{ github.event.inputs.track }}
          IN_REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          set -o pipefail
          ARGS=(--file "$IN_FILE" --distance "$IN_DISTANCE" --date "$IN_DATE")
          [ -n "$IN_TRACK" ] && ARGS+=(--track "$IN_TRACK")
          if [ "$IN_REFRESH" = "yes" ]; then
            LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true; the refresh needs the live key"; exit 1; }
            ARGS+=(--refresh live)
          fi
          python scripts/price_nominations.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
