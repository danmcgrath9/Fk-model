name: fk all states

# The daily pull for the states other than Victoria. Switched ON 12 Nov 2026 (founder: "pull the data for today, friday
# and saturday for all other states so we can keep data", ahead of going live with the other states on Fri 20 Nov and
# the national archive arriving Fri 13 Nov, which ends the day before Dave produces it). Victoria's own pull, results
# and pricing are untouched by it.
#   11:45am Melbourne  that day's races for every other state (founder, 12 Nov: "start the pulls later, lets say
#                      11:15am", so the riders are in), speedmaps once per meeting at this pull
#   3:30am Melbourne   the previous day's results for the same states, one meeting summary each (after fk results)
#   pull     every state's race fields for the day (2 credits a race, 5 a meeting for speedmaps, 1 for the list), with
#            no horse profiles and no separate past-event copies (the model reads each runner's form from its entry)
#   results  the next morning's results for the same states (5 credits a meeting)

on:
  schedule:
    - cron: '45 0 * * *'    # 11:45 Melbourne in daylight saving (10:45 in standard time): the pull, after the 11:15 Victorian price run (same queue)
    - cron: '30 16 * * *'   # 03:30 Melbourne in daylight saving (02:30 in standard time): the results
  workflow_dispatch:
    inputs:
      mode:
        description: 'pull or results'
        default: 'pull'
      date:
        description: 'meeting date YYYY-MM-DD (pull: default today before noon Melbourne, else tomorrow; results: default yesterday)'
        default: ''
      states:
        description: 'Form King states, comma separated'
        default: 'NSW,QLD,SA,WA,TAS,ACT,NT'
      dry_run:
        description: 'yes = plan and price only (pull mode), no network, no database'
        default: 'no'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      # a big Saturday across seven states is about 150 races (300 credits) and 25 meetings (125): room above that
      FK_MAX_CREDITS_PER_RUN: '900'
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull or results
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true"; exit 1; }
          STATES="${{ github.event.inputs.states || 'NSW,QLD,SA,WA,TAS,ACT,NT' }}"
          MODE="${{ github.event.inputs.mode || 'pull' }}"
          [ "${{ github.event.schedule }}" = "30 16 * * *" ] && MODE=results
          DATE_ARG=""; [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          # A scheduled pull is always that day's races, even when GitHub fires it late (12 Nov: the first 11:15 run
          # never fired, and a late run after noon would otherwise default to tomorrow, before its riders are in)
          [ "${{ github.event.schedule }}" = "45 0 * * *" ] && DATE_ARG="--date $(TZ=Australia/Melbourne date +%F)"
          echo "mode $MODE, states $STATES" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "results" ]; then
            python scripts/fetch_results.py --key live --yes --state "$STATES" $DATE_ARG | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            DRY=""; [ "${{ github.event.inputs.dry_run }}" = "yes" ] && DRY="--dry-run"
            python scripts/daily_pull.py --key live --yes --state "$STATES" --no-profiles --no-past-events $DATE_ARG $DRY | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python scripts/db_size.py | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
