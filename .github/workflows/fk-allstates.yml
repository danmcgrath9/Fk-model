name: fk all states

# The daily pull for the states other than Victoria (11 Nov 2026, founder: "we want to do a pull every morning of all
# states", once the national archive is in and an all-states model has been tested). DORMANT: no schedule, run by
# hand only, until the founder switches it on; Victoria's own pull, results and pricing are untouched by it.
#   pull     every state's race fields for the day (2 credits a race, 5 a meeting for speedmaps, 1 for the list), with
#            no horse profiles and no separate past-event copies (the model reads each runner's form from its entry)
#   results  the next morning's results for the same states (5 credits a meeting)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pull or results'
        default: 'pull'
      date:
        description: 'meeting date YYYY-MM-DD (pull: default today before noon Melbourne, else tomorrow; results: default yesterday)'
        default: ''
      states:
        description: 'Form King states, comma separated'
        default: 'NSW,QLD,SA,WA,TAS,ACT,NT'
      dry_run:
        description: 'yes = plan and price only (pull mode), no network, no database'
        default: 'no'

concurrency:
  group: fk-daily-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull or results
        run: |
          LIVE_FLAG="$(echo "${{ vars.FK_LIVE }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ "$LIVE_FLAG" = "true" ] || { echo "FK_LIVE is not true"; exit 1; }
          DATE_ARG=""; [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          if [ "${{ github.event.inputs.mode }}" = "results" ]; then
            python scripts/fetch_results.py --key live --yes --state "${{ github.event.inputs.states }}" $DATE_ARG | tee -a "$GITHUB_STEP_SUMMARY"
          else
            DRY=""; [ "${{ github.event.inputs.dry_run }}" = "yes" ] && DRY="--dry-run"
            python scripts/daily_pull.py --key live --yes --state "${{ github.event.inputs.states }}" --no-profiles --no-past-events $DATE_ARG $DRY | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python scripts/db_size.py | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
