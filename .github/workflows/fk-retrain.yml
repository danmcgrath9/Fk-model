name: fk retrain

# Daily refit of model v5 on every resulted race with a Betfair SP (fitted to BSP), after the
# morning results run. No Form King calls and no credits: the dataset comes from the database.
#
# A retrain NEVER replaces the live model on its own. It is saved as the CHALLENGER
# (challenger/ on the `models` branch) and the live model is untouched. Why: the holdout is
# every race from 6 May, so each new race lands in the TEST set, not the training set. The
# holdout KL of a retrain is measured on a different (larger) set of races from the live
# model's figure, it cannot show what the new races taught the model, and two refits of the
# same method differ by run-to-run noise either way. Comparing those two numbers is not a test.
# The challenger goes live only by a deliberate dispatch with promote=yes, once it has beaten
# the live model at BSP on races run after both were trained.

on:
  schedule:
    - cron: '30 22 * * *'   # 08:30 Melbourne in standard time, 09:30 in daylight saving (after fk results)
  workflow_dispatch:
    inputs:
      promote:
        description: 'yes = make this retrain the LIVE model (only after it has won a forward test)'
        default: 'no'

concurrency:
  group: fk-retrain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          pip install -r requirements.txt
          pip install lightgbm catboost
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch the history files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/fetch_history.sh
      - name: Export the training set
        run: |
          mkdir -p research/form_gbm/ds
          python scripts/export_dataset.py --out research/form_gbm/ds/model_ds.npz | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retrain
        working-directory: research/form_gbm
        run: ./retrain.sh 2>&1 | tee retrain.log | grep -v -E "^(nn|cb|sm|rg|block) [0-9]"
      - name: Save as challenger (or promote)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE: ${{ github.event.inputs.promote }}
        working-directory: research/form_gbm
        run: |
          set -euo pipefail
          NEW=$(cat holdout.txt)
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/models && git clone -q --depth 1 --branch models "$REMOTE" /tmp/models
          RACES=$(python3 -c "import numpy as np; z=np.load('ds/model_ds.npz',allow_pickle=True); print(len(z['race_id']), max(z['date']))")
          LAST=$(python3 -c "import numpy as np; z=np.load('ds/model_ds.npz',allow_pickle=True); print(max(z['date']))")
          if [ "${PROMOTE:-no}" = "yes" ]; then DEST=/tmp/models; ROLE=live; else DEST=/tmp/models/challenger; ROLE=challenger; fi
          mkdir -p "$DEST"
          for f in all9_sm*.txt all9_rg*.txt S_hist.npy; do gzip -c "$f" > "$DEST/$f.gz"; done
          cp cb_all9.cbm p_oof_blend9.npy S_fields.npy stage2e_*.txt "$DEST/"
          python3 -c "import json; json.dump({'role': '$ROLE', 'holdout_kl': $NEW, 'races': '$RACES', 'trained_through': '$LAST', 'trained_utc': '$(date -u +%Y-%m-%dT%H:%MZ)', 'note': 'holdout KL is a did-anything-break check, not a comparison with the live model'}, open('$DEST/metrics.json','w'), indent=1)"
          { echo "## Retrain"; echo "races (count, last date): $RACES"; echo "holdout KL to BSP: $NEW (a did-anything-break check; not comparable with the live model's figure)"; echo "saved as: $ROLE"; } | tee -a "$GITHUB_STEP_SUMMARY"
          cd /tmp/models && git config user.name "fk retrain" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Model v5 retrained $(date -u +%Y-%m-%d) as $ROLE: trained through $LAST, holdout KL $NEW" && git push -q "$REMOTE" models
