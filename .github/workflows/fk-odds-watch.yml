name: fk odds watch

# Watch one meeting's market after TAB opens it (18 Oct 2026, founder: "I look at tab, tell you tab is open and then you
# pull that race every 30 minutes, to see which bookmakers come up first and how many / how quick and average odds").
# One Get Meeting Summary per pull (5 credits), stored to fk.odds_snapshots with the raw odds (best price, the
# bookmakers holding it, the average, the minute-by-minute flucs). scripts/odds_watch.py reads them back.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'meeting date YYYY-MM-DD'
        required: true
      track:
        description: 'track, e.g. Kyneton'
        required: true
      every:
        description: 'minutes between pulls'
        default: '30'
      pulls:
        description: 'number of pulls (5 credits each)'
        default: '10'

concurrency:
  group: fk-odds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FK_SPEC_PATH: b2c-openapi.yaml
      FK_LEDGER: postgres
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.FK_DATABASE_URL }}
      FK_MAX_CREDITS_PER_RUN: ${{ vars.FK_MAX_CREDITS_PER_RUN || '600' }}
      FK_MIN_BALANCE: ${{ vars.FK_MIN_BALANCE || '1000' }}
      FK_API_KEY: ${{ secrets.FK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull on a timer
        run: |
          N=${{ github.event.inputs.pulls }}; E=${{ github.event.inputs.every }}
          for i in $(seq 1 $N); do
            echo "== pull $i of $N at $(TZ=Australia/Melbourne date '+%a %H:%M')"
            python scripts/morning_odds.py --key live --date "${{ github.event.inputs.date }}" --track "${{ github.event.inputs.track }}" --yes || echo "pull $i failed"
            [ $i -lt $N ] && sleep $((E * 60))
          done
      - name: Report
        if: always()
        run: python scripts/odds_watch.py "${{ github.event.inputs.date }}" "${{ github.event.inputs.track }}" | tee watch.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: always()
        run: |
          [ -s watch.md ] || exit 0
          F="data/live_bets/odds-watch-${{ github.event.inputs.date }}-$(echo '${{ github.event.inputs.track }}' | tr 'A-Z ' 'a-z-').md"
          cp watch.md "$F"
          git config user.name "fk-odds-watch"; git config user.email "actions@users.noreply.github.com"
          git add "$F" && git commit -m "Odds watch: $F" && for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i*3)); done
