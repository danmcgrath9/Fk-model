name: nrl lines

# NRL betting lines from The Odds API (nrl/README.md). Probe first: a capped look at what the archive
# holds, run once. Raw responses go to the nrl-history release; PROBE.md goes to the run page.
# Its own concurrency group, no Form King key, no BetMatic. The key lives only in ODDS_API_KEY.

on:
  workflow_dispatch:
    inputs:
      max_credits:
        description: 'stop before spending more than this many credits'
        default: '300'
  push:
    branches: [nrl-model]
    paths:
      - 'nrl/lines/**'
      - '.github/workflows/nrl-lines.yml'

concurrency:
  group: nrl-lines
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      MAX_CREDITS: ${{ github.event.inputs.max_credits || '300' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run the probe once
        run: |
          gh release view nrl-history >/dev/null 2>&1 || gh release create nrl-history --target main --latest=false \
            --title "NRL history" --notes "NRL model data (nrl/README.md). Written by the nrl-* workflows; do not delete." || gh release view nrl-history >/dev/null
          # a re-push must not spend again: the probe's results on the release mean it has run
          if gh release view nrl-history --json assets --jq '.assets[].name' | grep -qx 'odds_probe_v1.tar.gz'; then
            echo "probe v1 already on the release; not spending credits again" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -n "$ODDS_API_KEY" ] || { echo "ODDS_API_KEY secret is not set"; exit 1; }
          set -o pipefail
          python nrl/lines/probe.py
          tar czf odds_probe_v1.tar.gz -C nrl/cache odds_probe
          gh release upload nrl-history odds_probe_v1.tar.gz --clobber
